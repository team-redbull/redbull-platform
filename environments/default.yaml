# ---------------------------------------------------------------------------
# Default environment values for the redbull-platform helmfile.
# Override per environment (e.g. environments/prod.yaml) or with `helmfile --state-values-set`.
# ---------------------------------------------------------------------------

# Git refs the service charts are pulled from (per repo). Pin to tags for prod.
refs:
  temporalStack: main
  segmentManager: refactor/segments-manager
  workflows: main
  dhcp: main
  bmh: main
  serverScanner: main

crossplane:
  version: "2.3.2"

# Standalone PostgreSQL backing the Temporal stack. Deployed as its own release
# so it exists (and is ready) before temporal-stack's pre-install schema job runs.
temporalPostgresql:
  password: "temporal-postgres-pw"

# Standalone MongoDB backing segments-manager. Deployed as its own release so
# it's ready before segments-manager starts.
segmentsManagerMongodb:
  rootPassword: "segments-manager-mongo-root-pw"
  password: "segments-manager-mongo-pw"

providerHttp:
  package: xpkg.upbound.io/crossplane-contrib/provider-http:v1.0.14
  packagePullSecrets: []        # e.g. [artifactory] for air-gapped
  providerConfigName: dhcp-http # shared with the dhcp integration below

# Shared Temporal connection info — every workflow-domain release (workflow-worker,
# connectivity, and any future domain chart) reads its own copy of these into its
# own Deployment, since each is an independent Temporal client. Kept here, once,
# so there's a single place to change the Temporal endpoint for the whole platform.
temporal:
  host: "temporal-frontend.temporal.svc.cluster.local:7233"
  namespace: "default"

# connectivity (activity limb) release's domain-specific wiring: segments-manager
# and the next (firewall) service.
connectivityWorkflow:
  segmentManagerUrl: "http://segments-manager.segments-manager.svc.cluster.local:8000"
  # In production the next (connectivity/firewall) service is another team's,
  # reached over the air-gapped network — not deployed by this platform. Here
  # it points at this platform's own `mock-connectivity` release instead
  # (see helmfile.yaml.gotmpl), so e2e tests can exercise the full
  # submit -> poll -> complete cycle without the real service.
  # TODO: for a real prod environment, override nextUrl (and re-verify these
  # URI paths against the real API) to point at the actual next service.
  nextUrl: "http://mock-connectivity.redbull-workflows.svc.cluster.local:9000"
  nextTokenRenewalUri: "/token-renewal-uri"
  nextOpenRulesUri: "/open-rules-uri"
  nextCheckStatusUri: "/check-request-status"
  domain: "domain1"
  # Bearer token for mutating Segments Manager calls — MUST match that
  # deployment's own auth token (segments-manager chart's `auth.existingSecret`,
  # created out-of-band; see its values.yaml). Placeholder only — override for
  # non-local environments, never commit the real token here.
  segmentManagerApiToken: "dev-token"

# dhcp_scope_manager <-> provider-http. apiUrl is the backend DHCP API the
# Crossplane Request talks to. No scope Requests are created unless you set
# dhcp_values below (the chart guards on dhcp_values.scopeName).
dhcp:
  apiUrl: "https://dhcp-api.lab.local"   # TODO: real DHCP API endpoint
