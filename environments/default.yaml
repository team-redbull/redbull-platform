# ---------------------------------------------------------------------------
# Default environment values for the redbull-platform BOOTSTRAP helmfile.
#
# Only the bootstrap + still-Helmfile-managed services live here now. The
# stateless service layer (temporal, segments-manager, workflows-orchestrator,
# segment-lifecycle-worker, workflows-docs, dhcp-scope-manager, rhokp) moved to Argo CD —
# each of those is configured entirely by its own chart's values.yaml under
# gitops/charts/<service>/. There is no per-environment values layer over there.
#
# Override per environment (e.g. environments/prod.yaml) or with
# `helmfile --state-values-set`.
# ---------------------------------------------------------------------------

# Git refs the CHARTS STILL PULLED BY HELMFILE come from. Pin to tags for prod.
# (temporalStack/segmentManager refs are gone — those charts live in this repo now, under
# gitops/charts/, and are rendered by Argo from whatever revision of this repo is
# deployed. No per-app ref to pin.)
refs:
  workflows: main        # only mock-segment-connectivity is still Helmfile-pulled from this repo
  dhcp: main
  bmh: main
  serverScanner: main

crossplane:
  version: "2.3.2"

# Cluster authentication: htpasswd users merged into whatever OpenShift cluster this
# platform deploys onto, plus a cluster-admin grant. See htpasswd-idp's postsync hook
# (charts/htpasswd-idp/scripts/apply-oauth.sh) and CLAUDE.md. ocpadmin/Password1 is a
# bootstrap credential for throwaway/sandbox clusters — override both per environment
# before pointing this at anything long-lived.
#
# NOTE: `clusterAdmins` is also the source of truth for the Temporal UI's allowedUsers,
# set in gitops/charts/temporal/values.yaml (ui.auth.allowedUsers). Keep the two in sync
# until secrets/identity move to a single source (see gitops/SECRETS.md).
htpasswdIdp:
  bootstrapProviderName: redbull-platform
  bootstrapSecretName: redbull-platform-htpasswd
  users:
    - username: ocpadmin
      password: Password1
  clusterAdmins:
    - ocpadmin
  # OpenShift group the clusterAdmins above are also added to, purely so they can SEE
  # anything in the Argo CD UI. OpenShift GitOps' argocd-rbac-cm has an empty
  # `policy.default` and grants role:admin only to the GROUPS `system:cluster-admins`
  # and `cluster-admins` — a user who is cluster-admin via a direct User binding
  # matches neither and gets an empty, error-free application list. Membership here
  # grants no Kubernetes privilege of its own (OpenShift's `cluster-admins`
  # ClusterRoleBinding binds the virtual `system:cluster-admins`, not this group).
  # Set to "" to skip the group entirely; change it if your instance's RBAC policy
  # names a different group.
  argocdRbacGroup: cluster-admins

# Standalone MongoDB backing segments-manager, deployed as its own Helmfile release so
# it's ready before the Argo-managed segments-manager app starts. The segments-manager
# app reads this same password in its Mongo connection URL
# (gitops/charts/segments-manager/values.yaml) — kept in sync by hand until ESO
# composes the URL from Vault (see gitops/SECRETS.md).
segmentsManagerMongodb:
  rootPassword: "segments-manager-mongo-root-pw"
  password: "segments-manager-mongo-pw"

providerHttp:
  package: xpkg.upbound.io/crossplane-contrib/provider-http:v1.0.14
  packagePullSecrets: []        # e.g. [artifactory] for air-gapped
  providerConfigName: dhcp-http # shared with the dhcp integration below
  # ServiceAccounts of the Argo CD instance that syncs Request objects, granted
  # create/update/delete on them. Without this every hosted-cluster Application fails
  # to sync with "requests.http.m.crossplane.io is forbidden".
  #
  # Both SAs of ONE instance: the controller applies the Requests, and the server needs
  # read access or the UI cannot render the resource tree and a UI "Sync" fails even
  # though the controller could do it. Only the instance that owns the Applications
  # belongs here — a second one listed out of caution just holds standing write access
  # to every DHCP scope. Air-gapped substitutes its own instance's SAs.
  argocdServiceAccounts:
    - name: openshift-gitops-argocd-application-controller
      namespace: openshift-gitops
    - name: openshift-gitops-argocd-server
      namespace: openshift-gitops

# dhcp_scope_manager <-> provider-http. apiUrl is the backend DHCP API the Crossplane
# Request talks to. No scope Requests are created unless you set dhcp_values below (the
# chart guards on dhcp_values.scopeName).
dhcp:
  apiUrl: "https://dhcp-api.lab.local"   # TODO: real DHCP API endpoint
