# ---------------------------------------------------------------------------
# Default environment values for the redbull-platform BOOTSTRAP helmfile.
#
# Only the bootstrap + still-Helmfile-managed services live here now. The
# stateless service layer (temporal, segments-manager, workflows,
# segment-lifecycle-worker) moved to Argo CD — its values live under gitops/ (shared
# globals in gitops/values/<env>.yaml, per-service in
# gitops/services/<env>/<service>/values.yaml).
#
# Override per environment (e.g. environments/prod.yaml) or with
# `helmfile --state-values-set`.
# ---------------------------------------------------------------------------

# Git refs the CHARTS STILL PULLED BY HELMFILE come from. Pin to tags for prod.
# (temporalStack/segmentManager refs are gone — those charts are Argo-managed now,
# pinned per-app in gitops/services/<env>/<svc>/app.yaml `revision:`.)
refs:
  workflows: main        # only mock-segment-connectivity is still Helmfile-pulled from this repo
  dhcp: main
  bmh: main
  serverScanner: main

crossplane:
  version: "2.3.2"

# Cluster authentication: htpasswd users merged into whatever OpenShift cluster this
# platform deploys onto, plus a cluster-admin grant. See htpasswd-idp's postsync hook
# (charts/htpasswd-idp/scripts/apply-oauth.sh) and CLAUDE.md. ocpadmin/Password1 is a
# bootstrap credential for throwaway/sandbox clusters — override both per environment
# before pointing this at anything long-lived.
#
# NOTE: `clusterAdmins` is also the source of truth for the Temporal UI's allowedUsers,
# now set in gitops/services/<env>/temporal/values.yaml (ui.auth.allowedUsers). Keep the
# two in sync until secrets/identity move to a single source (see gitops/SECRETS.md).
htpasswdIdp:
  bootstrapProviderName: redbull-platform
  bootstrapSecretName: redbull-platform-htpasswd
  users:
    - username: ocpadmin
      password: Password1
  clusterAdmins:
    - ocpadmin

# Standalone MongoDB backing segments-manager, deployed as its own Helmfile release so
# it's ready before the Argo-managed segments-manager app starts. The segments-manager
# app reads this same password in its Mongo connection URL
# (gitops/services/<env>/segments-manager/values.yaml) — kept in sync by hand until ESO
# composes the URL from Vault (see gitops/SECRETS.md).
segmentsManagerMongodb:
  rootPassword: "segments-manager-mongo-root-pw"
  password: "segments-manager-mongo-pw"

providerHttp:
  package: xpkg.upbound.io/crossplane-contrib/provider-http:v1.0.14
  packagePullSecrets: []        # e.g. [artifactory] for air-gapped
  providerConfigName: dhcp-http # shared with the dhcp integration below

# dhcp_scope_manager <-> provider-http. apiUrl is the backend DHCP API the Crossplane
# Request talks to. No scope Requests are created unless you set dhcp_values below (the
# chart guards on dhcp_values.scopeName).
dhcp:
  apiUrl: "https://dhcp-api.lab.local"   # TODO: real DHCP API endpoint
