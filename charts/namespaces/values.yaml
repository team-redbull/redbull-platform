# Namespaces this platform creates up front.
namespaces:
  - crossplane-system
  - temporal              # Argo-managed: the `temporal` app deploys here
  - segments-manager      # Argo `segments-manager` app + Helmfile mongodb release
  - bmh-system
  - server-scanner
  - redbull-workflows     # Argo workflows + segment-lifecycle-worker apps + Helmfile mock release
  - dhcp-scope-manager    # Argo-managed: the `dhcp-scope-manager` app deploys here

# OpenShift GitOps (Argo CD) instance that OWNS the app namespaces below. A
# namespace-scoped instance only gets RBAC in namespaces labeled
# `argocd.argoproj.io/managed-by: <instance>`, so we stamp that label here on the
# namespaces the Argo apps deploy into, letting them sync into pre-created namespaces.
#
# The current target is `openshift-gitops`, the operator's DEFAULT instance, which is
# CLUSTER-scoped — so for it the label is a harmless no-op rather than a requirement.
# It is kept set anyway: it costs nothing, it documents which instance owns these
# namespaces, and it is exactly what an environment running a namespaced instance
# (as this repo previously did, with `user1-argocd`) needs in order to work at all.
# Leave managedBy empty to stop stamping it.
argocd:
  managedBy: openshift-gitops
  managedNamespaces:
    - temporal
    - segments-manager
    - redbull-workflows
    - dhcp-scope-manager
