{{- if .Values.providerConfig.enabled }}
# ClusterProviderConfig, in Crossplane v2's namespaced API group (http.m.crossplane.io).
#
# provider-http v1.0.14 serves two independent API groups, and an object in one cannot be
# referenced from the other:
#
#   http.crossplane.io    Request (Cluster)     ProviderConfig (Cluster)
#   http.m.crossplane.io  Request (Namespaced)  ClusterProviderConfig (Cluster) / ProviderConfig (Namespaced)
#
# hostedclusters-setup renders the *namespaced* Request, whose providerConfigRef carries a
# required `kind` — so it needs this object. Cluster-scoped rather than the group's own
# namespaced ProviderConfig because one DHCP API serves every hosted cluster: a namespaced
# config would need a copy in each cluster's namespace.
#
# The legacy http.crossplane.io ProviderConfig that stood beside this one is gone. It existed
# only while cluster-scoped Requests still referenced it — it carries an in-use.crossplane.io
# finalizer, so it could not be removed before they were. `kubectl get
# requests.http.crossplane.io` now returns nothing and its status.users is empty, so nothing
# holds it. Restore it by reverting this commit if the migration is ever rolled back.
apiVersion: http.m.crossplane.io/v1alpha2
kind: ClusterProviderConfig
metadata:
  name: {{ .Values.providerConfig.name }}
spec:
  credentials:
    source: {{ .Values.providerConfig.credentialsSource }}
{{- end }}
