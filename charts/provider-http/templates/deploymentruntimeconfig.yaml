{{- if and .Values.provider.enabled .Values.deploymentRuntimeConfig.enabled }}
# OpenShift SCC fix for the PROVIDER'S OWN runtime pod.
#
# Nulling securityContextCrossplane in the helmfile only fixes the crossplane core
# Deployments. This pod's Deployment is generated by Crossplane's package manager
# from the provider package, which bakes in runAsUser/runAsGroup 2000 — outside the
# namespace's SCC-assigned UID range — so the pod is never created ("unable to
# validate against any security context constraint") and the Provider stays
# HEALTHY=False forever. No Helm value reaches that Deployment.
#
# Clearing the security context via this runtime config does NOT work: Crossplane
# honours an empty container securityContext but re-applies the pod-level one
# unconditionally (verified on 2.3.2 — pod keeps runAsUser 2000 either way). So
# instead we keep the package's own non-root UID and grant it the `nonroot-v2` SCC,
# whose MustRunAsNonRoot policy accepts any non-zero UID. That also preserves the
# package's intended hardening rather than stripping it.
#
# Granting an SCC needs a stable ServiceAccount to bind to, but Crossplane names the
# SA after the provider REVISION (provider-http-<hash>), which changes on every
# package upgrade and would silently break the binding. serviceAccountTemplate pins
# it, so the RoleBinding in scc-rolebinding.yaml keeps working across upgrades.
#
# Gated on provider.enabled so only the `provider-http` release owns these objects —
# `provider-http-config` renders the same chart and would otherwise collide.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Values.deploymentRuntimeConfig.name }}
spec:
  serviceAccountTemplate:
    metadata:
      name: {{ .Values.deploymentRuntimeConfig.serviceAccountName }}
{{- end }}
