# Cluster monitoring is configured through two ConfigMaps OpenShift's
# cluster-monitoring-operator reads, both in namespaces this platform
# does not otherwise touch. Neither exists on a fresh cluster (verified
# on the sandbox 2026-09-12 before this chart was written), so Helm can
# own them cleanly. If a cluster already has one — the operator's docs
# tell admins to hand-write exactly these — adopt it first
# (`kubectl label`/`annotate` with Helm's release metadata) or import it,
# or the install fails with "invalid ownership metadata", same as every
# pre-existing object CLAUDE.md warns about.

# User-workload monitoring: a second Prometheus that scrapes every
# ServiceMonitor in every user namespace and feeds Observe -> Metrics for
# that project. Off by default in OpenShift; nothing in gitops/charts/*
# can turn it on for itself.
enableUserWorkload: true

# How long the user-workload Prometheus keeps data locally. Only matters
# for the console; the remote write below is the long-term store.
retention: 7d

# Where the user-workload Prometheus forwards everything it scrapes.
# Leave `url` empty to keep metrics in-cluster only. Auth goes in the
# same entry (basicAuth / authorization / tlsConfig — the OpenShift
# `remoteWrite` schema is the Prometheus Operator's), with any Secret it
# names created in openshift-user-workload-monitoring out of band, like
# every other credential here (gitops/SECRETS.md).
remoteWrite:
  url: ""
  # Only forward this platform's own series. Drop the block to forward
  # every user-workload metric on the cluster.
  writeRelabelConfigs:
    - sourceLabels: [__name__]
      regex: "server_scan_.*|http_request.*|cache_operations_total|mongo_ping_failures_total"
      action: keep
  # Merged verbatim into the remoteWrite entry, e.g.
  #   extra:
  #     basicAuth:
  #       username: {name: thanos-remote-write, key: username}
  #       password: {name: thanos-remote-write, key: password}
  extra: {}
