# Helm values for segments-manager (dev). Mirrors the old segments-manager release
# `values:` block from the Helmfile.
#
# fullnameOverride pins the resource/Service name to `segments-manager` regardless of the
# Argo release name (the app is `dev-segments-manager`). Without this, the chart would
# name the Service `dev-segments-manager`, breaking the cross-service FQDN
# `segments-manager.segments-manager.svc...` that workflows/limbs use
# (orchestrator.segmentsManagerUrl in gitops/values/dev.yaml). temporal/workflows/
# segment-connectivity charts already fix their names internally; this one didn't.
fullnameOverride: segments-manager
config:
  # Cross-namespace FQDN of the shared workflow trigger API (workflows release's
  # workflows-api Service in redbull-workflows). Segment creation POSTs here to start the
  # workflow. MUST be the FQDN — a bare name would resolve in segments-manager's own ns.
  workflowsApiUrl: "http://workflows-api.redbull-workflows.svc.cluster.local:8080"
mongodb:
  # In-cluster MongoDB (Helmfile-managed segments-manager-mongodb release, service
  # `segments-mongodb`). TODO(secrets): the password is interpolated inline here — this
  # whole URL must move to an ESO-composed Secret; segments-manager then reads it via
  # existingSecret. See gitops/SECRETS.md (the non-obvious migration item).
  url: "mongodb://segments_manager:segments-manager-mongo-pw@segments-mongodb.segments-manager.svc.cluster.local:27017/segments_manager?authSource=segments_manager"
  dbName: segments_manager
