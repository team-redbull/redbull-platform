# Argo config for `workflows` — the Temporal workflow "brain", ONE shared release for
# every workflow domain. app = dev-workflows, chart = helm-charts-workflows. Deploys into
# redbull-workflows and owns the `workflows-config` ConfigMap every limb mounts.
namespace: redbull-workflows
revision: main   # branch in helm-charts-workflows — main = latest prod; a different version = a different branch.
