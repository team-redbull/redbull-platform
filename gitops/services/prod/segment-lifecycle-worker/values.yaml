# Helm values for segment-lifecycle-worker (dev). Mirrors the old segment-lifecycle
# release `values:` block. Only the segment-lifecycle-specific endpoints live here;
# the Temporal connection, DOMAIN and SEGMENTS_MANAGER_URL come from the shared
# workflows-orchestrator-config ConfigMap (owned by the workflows-orchestrator release), mounted at runtime.
config:
  # In dev, `next` points at the Helmfile-managed mock-segment-connectivity Service so
  # e2e tests can run the full submit -> poll -> complete cycle without the real
  # (air-gapped) firewall service. TODO(prod): override nextUrl at the real next endpoint
  # and re-verify these URI paths against the real API.
  nextUrl: "http://mock-segment-connectivity.redbull-workflows.svc.cluster.local:9000"
  nextTokenRenewalUri: "/token-renewal-uri"
  nextOpenRulesUri: "/open-rules-uri"
  nextCheckStatusUri: "/check-request-status"
  # allocate-segment's DHCP convergence poll (read-only) — dhcp-scope-manager's
  # in-cluster Service, NOT its -tests sibling. The chart default points at a
  # local dev host, so this override is required in-cluster.
  dhcpApiUrl: "http://dhcp-scope-manager.dhcp-scope-manager.svc.cluster.local:8080"
secrets:
  # Out-of-band Secret (key SEGMENTS_MANAGER_API_TOKEN) created once in-cluster, holding
  # the SAME value as segments-manager's own segments-manager-api-token Secret. The token
  # never passes through git or Helm values:
  #   oc create secret generic segments-manager-token -n redbull-workflows \
  #     --from-literal=SEGMENTS_MANAGER_API_TOKEN="<the segments-manager token>"
  # See gitops/SECRETS.md.
  existingSecret: segments-manager-token
  # allocate-segment's credential, same out-of-band pattern. Setting this stops
  # the chart from rendering its own dev-token Secret of the same name (which
  # Argo would then own and stomp the real value with on every sync).
  #   day1-git-token:  key DAY1_GIT_TOKEN — pushes to gitops-day1-platform-config
  #
  # No DHCP API token here any more. allocate-segment's convergence poll is a GET,
  # and that API leaves its scope GETs unauthenticated so this worker needs no
  # credential for it. The copy that used to live here (dhcp-api-token, key
  # DHCP_API_TOKEN) held the same value dhcp-scope-manager does and had to rotate
  # in step with it — that rule is gone with it. Clean up the live Secret:
  #   oc delete secret dhcp-api-token -n redbull-workflows
  existingDay1Secret: day1-git-token
