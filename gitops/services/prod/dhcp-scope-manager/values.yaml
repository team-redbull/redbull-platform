# Helm values for dhcp-scope-manager.
#
# image.repository/tag are NOT set here: CI (ghcr-build-push.yml) bumps them in
# the chart's own values.yaml on every push to the code repo's main, and this
# file would override that bump and pin the deployment to a stale tag.

dhcp:
  # The Windows DHCP server this API manages. One explicit host on purpose — see
  # the chart's values.yaml for why an alias or load balancer breaks GET/PUT
  # symmetry under failover.
  #
  # This is the disposable AWS test box (test-env/ in the dhcp_scope_manager
  # repo). It now carries an Elastic IP, so this address survives stop/start and
  # even a full terraform replace of the instance — the EIP is a separate
  # resource that reattaches. It only changes if the EIP itself is released.
  serverHost: "107.20.133.130"

winrm:
  # credssp, not ntlm. Both are username+password, but only credssp *delegates*
  # the credential to the DHCP server, and without delegation every failover
  # cmdlet (CLAUDE.md sections 6-7) fails against the partner — measured on this
  # very box, where Add-DhcpServerv4FailoverScope fails under ntlm and succeeds
  # under credssp.
  #
  # Not kerberos: this test box is a standalone workgroup server with no Active
  # Directory. A domain-joined production server could use kerberos, but only
  # with resource-based constrained delegation configured in AD — plain kerberos
  # hits the same double hop as ntlm.
  #
  # Requires `Enable-WSManCredSSP -Role Server` on serverHost, which the
  # test-env bootstrap now does. Only that host needs it, not the partner.
  auth: credssp
  username: Administrator
  # The listener uses a self-signed certificate, so validation must be off.
  # In production this should be true, with a certificate from the internal CA.
  certValidation: false
  # Password comes from this Secret, created out of band (gitops/SECRETS.md):
  #   oc create secret generic dhcp-scope-manager-winrm \
  #     --from-literal=winrm-password='...' -n dhcp-scope-manager
  existingSecret: dhcp-scope-manager-winrm
  passwordKey: winrm-password

apiAuth:
  # Out-of-band Secret (gitops/SECRETS.md pattern), NOT the chart's generated
  # one: the chart's lookup-then-generate keeps the token stable under
  # `helm upgrade`, but Argo CD renders with `helm template`, where `lookup`
  # returns nothing — so every re-render ROTATED the token while the running
  # pod kept its startup value (observed live: pod env vs Secret disagreed).
  # Pinning an existing Secret ends the rotation; segment-lifecycle-worker
  # holds a copy of the same token (dhcp-api-token in redbull-workflows) for
  # the allocate-segment convergence poll, and that copy must stay in sync:
  #   oc create secret generic dhcp-scope-manager-token \
  #     --from-literal=api-token='...' -n dhcp-scope-manager
  existingSecret: dhcp-scope-manager-token
  tokenKey: api-token

route:
  enabled: true
