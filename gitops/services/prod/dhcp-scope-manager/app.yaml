# Argo config for `dhcp-scope-manager`. app = dhcp-scope-manager (prod is
# canonical/unprefixed), chart = helm-charts-dhcp-scope-manager.
#
# The API runs here on Linux and drives a *Windows* DHCP server remotely over
# PSRP/WinRM — the Windows host is not managed by this platform. Crossplane
# provider-http consumes the API in-cluster via its Service.
namespace: dhcp-scope-manager
# The Linux/PSRP transport is still on a feature branch in the code repo, so this
# tracks the matching chart branch rather than main: CI mirrors the code repo's
# branch to a same-named chart branch and lands the image bump there. Same pattern
# segments-manager uses. Repoint to `main` once refactor/linux-api merges.
revision: refactor/linux-api   # branch in helm-charts-dhcp-scope-manager
