# Helm values for segments-manager. Mirrors the old segments-manager release
# `values:` block from the Helmfile.
#
# No fullnameOverride needed: the appset sets helm.releaseName to the service name
# (`segments-manager`), and this chart's fullname helper collapses to the release name
# when it contains the chart name — so resources are named `segments-manager` in every
# env, which the cross-service FQDN `segments-manager.<ns>.svc` relies on.
#
# No `config.workflowsApiUrl` (and no WORKFLOWS_API_URL env var): segments-manager does
# not call the workflows API at all. It used to POST there on every segment creation to
# start the segment-lifecycle workflow, which left creation outside Temporal —
# invisible in the Temporal UI, and silently skipped whenever that best-effort call
# failed. The direction is now reversed: the workflow is triggered directly by its
# caller and calls POST /api/segments here as its own first step, so one Temporal run
# covers the whole segment lifecycle. Traffic between the two namespaces now flows
# redbull-workflows -> segments-manager only.
mongodb:
  # In-cluster MongoDB (Helmfile-managed segments-manager-mongodb release, service
  # `segments-mongodb`). TODO(secrets): the password is interpolated inline here — this
  # whole URL must move to an ESO-composed Secret; segments-manager then reads it via
  # existingSecret. See gitops/SECRETS.md (the non-obvious migration item).
  url: "mongodb://segments_manager:segments-manager-mongo-pw@segments-mongodb.segments-manager.svc.cluster.local:27017/segments_manager?authSource=segments_manager"
  dbName: segments_manager
