# Argo config for `segments-manager` (dev). app = dev-segments-manager,
# chart = helm-charts-segments-manager. Its MongoDB is the Helmfile-managed
# segments-manager-mongodb release (stays in helmfile.yaml.gotmpl), reachable at the
# FQDN in values.yaml.
namespace: segments-manager
# segments-manager has no prod (code-main) release yet — it's mid-refactor, and the
# running image is a refactor-branch build. So it tracks the matching chart branch, not
# main. Repoint to `main` once segments-manager releases on its code main. CI mirrors the
# code repo's refactor/segments-manager branch to the same-named chart branch.
revision: refactor/segments-manager   # branch in helm-charts-segments-manager
