# Argo config for `segments-manager` (dev). app = dev-segments-manager,
# chart = helm-charts-segments-manager. Its MongoDB is the Helmfile-managed
# segments-manager-mongodb release (stays in helmfile.yaml.gotmpl), reachable at the
# FQDN in values.yaml.
namespace: segments-manager
revision: main   # branch in helm-charts-segments-manager — main = latest prod (has the CONNECTIVITY_WORKFLOW_API_URL env fix). A different version = a different branch.
