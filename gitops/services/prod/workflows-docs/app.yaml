# Argo config for `workflows-docs` — the documentation site for the workflow
# layer: the workflows-orchestrator guide as its homepage plus one page per
# workflow. app = workflows-docs, chart = helm-charts-workflows-docs (the
# ApplicationSet derives that repo name from this folder name).
#
# Deploys into redbull-workflows alongside the brain and the limbs, but depends
# on none of them: it is static HTML that mounts no ConfigMap and no Secret, so
# it has no install ordering against workflows-orchestrator (the limb charts do,
# because they mount workflows-orchestrator-config). It is deliberately its own
# service rather than a page served by workflows-orchestrator-api — the docs
# should stay readable while the orchestrator is down or mid-rollout, which is
# exactly when somebody is looking something up.
namespace: redbull-workflows
revision: main   # branch in helm-charts-workflows-docs — main = latest prod.
