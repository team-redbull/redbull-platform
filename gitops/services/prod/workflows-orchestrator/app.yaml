# Argo config for `workflows-orchestrator` — the Temporal workflow "brain", ONE shared
# release for every workflow domain AND every workflow within it. app =
# workflows-orchestrator, chart = helm-charts-workflows-orchestrator (the ApplicationSet
# derives that repo name from this folder name). Deploys into redbull-workflows and owns
# the `workflows-orchestrator-config` ConfigMap every limb mounts.
#
# Renamed from `workflows` (folder, Argo app, chart repo and K8s resources): `workflows`
# collided with the code repo name and with the /workflows API prefix. The API PATHS are
# unaffected by that rename — they are per workflow under a domain prefix
# (/workflows/segment-connectivity/open-segment-rules), status on /workflows/runs/{id}.
namespace: redbull-workflows
revision: main   # branch in helm-charts-workflows-orchestrator — main = latest prod; a different version = a different branch.
