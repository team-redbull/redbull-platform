# Helm values for the workflows-orchestrator brain (prod). `config.*` is the Temporal endpoint +
# orchestrator globals: this chart is the one that reads them and publishes them into
# the `workflows-orchestrator-config` ConfigMap that every workflow limb (segment-lifecycle,
# future domains) mounts at runtime — see helm-charts-workflows-orchestrator' templates/config.yaml
# and the `workflows` repo's shared/settings.py. Change Temporal's address/namespace or
# the orchestrator's domain/segments-manager URL here, once, for the whole workflow
# layer — no other chart needs its own copy of these.
#
# (Previously lived in gitops/values/<env>.yaml as a "shared global" — moved here once
# it became clear only this one chart consumes it as a Helm value; see that file's
# comment.)
config:
  temporalHost: "temporal-frontend.temporal.svc.cluster.local:7233"
  temporalNamespace: "default"
  domain: "domain1"
  segmentsManagerUrl: "http://segments-manager.segments-manager.svc.cluster.local:8000"

# Plus the chart's own defaults (image.repository/tag, bumped by CI in
# helm-charts-workflows-orchestrator) — no overrides needed here today.
