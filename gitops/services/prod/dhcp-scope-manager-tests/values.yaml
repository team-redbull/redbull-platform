# Helm values for dhcp-scope-manager-tests.
#
# image.repository/tag are NOT set here: CI bumps them in the chart's own
# values.yaml, so this release runs the same image as production — which is the
# point. The suite it runs is the one baked into that image.
#
# Note what is absent: no DHCP server, no WinRM account, no password. The server
# under test is named in the body of each POST /api/v1/test-runs request, so
# nothing in git can aim the destructive live suite at anything.

dhcp:
  # This release serves no scopes. Its own /api/v1/scopes/* routes return 503,
  # which is correct — it exists to run tests, not to manage DHCP.
  #
  # `local` rather than `psrp` precisely because psrp requires a serverHost, and
  # storing one here is what this file avoids. The chart switches readiness to a
  # TCP probe under `local`, because /healthz validates the DHCP environment and
  # would otherwise keep the pod out of Service endpoints forever.
  transport: local

apiAuth:
  # Production's generated Secret — one token for both releases, so a caller holds
  # a single credential for the API whichever one answers. Works because both live
  # in the `dhcp-scope-manager` namespace.
  #
  # This makes the production release a prerequisite: without that Secret the pod
  # stays in CreateContainerConfigError.
  existingSecret: dhcp-scope-manager-api-token
  tokenKey: api-token

testRunner:
  timeoutSeconds: 1800
  # Fail closed. This release has no dhcp.serverHost for the app to refuse
  # implicitly, so name the server it must never run the live suite against —
  # the one production manages.
  denyHosts:
    - "107.20.133.130"

route:
  # In-cluster only. Nothing outside the cluster needs to trigger a test run:
  #   oc port-forward svc/dhcp-scope-manager-tests 8080:8080 -n dhcp-scope-manager
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    # A full pytest run peaks 150-250Mi above the idle uvicorn process.
    memory: 768Mi
