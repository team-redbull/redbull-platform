# Argo config for `dhcp-scope-manager-tests` — a second release of the
# dhcp-scope-manager chart whose only job is running that service's own test suite
# on demand, via POST /api/v1/test-runs.
#
# No chart repo of its own. `repoUrl` is the ApplicationSet's documented escape
# hatch, and it points at the service's existing chart: this release differs from
# production only in values, so a helm-charts-dhcp-scope-manager-tests repo would
# have to carry a *copy* of the same Deployment/Service/Secret templates. Copies
# drift, and this platform just finished deleting one such copy-and-sync
# arrangement (see the templates move out of dhcp_scope_manager).
namespace: dhcp-scope-manager
# Same namespace as production on purpose. The release name differs, so the
# chart's fullname helper resolves every resource to `dhcp-scope-manager-tests`
# and nothing collides — and a Secret is namespace-scoped, which is what lets this
# release read production's generated API token instead of minting a second
# credential for the same API.
repoUrl: https://github.com/team-redbull/helm-charts-dhcp-scope-manager.git
# Tracks the same chart branch as the production app, for the same reason: the
# Linux/PSRP work is still on a feature branch and CI lands the image bump on the
# name-matched chart branch. Repoint to `main` with the production app.
revision: feat/in-cluster-test-runner
