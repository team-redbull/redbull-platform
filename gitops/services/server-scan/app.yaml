# Argo config for `server-scan` — the bare-metal server inventory platform
# (team-redbull/server_scan). Chart: gitops/charts/server-scan, a copy of that
# repo's own deploy/helm/server-scan with this cluster's values on top.
#
# Unlike segments-manager, its MongoDB is NOT a separate Helmfile release: the
# chart bundles MongoDB and Redis as Bitnami subcharts, gated by
# `mongodb.enabled` / `redis.enabled`. That is the same Argo-only exception
# temporal takes for its PostgreSQL — safe here for a simpler reason than
# temporal's sync waves, since nothing needs ordering: the API's readiness
# probe fails until Mongo answers and Argo's own retry handles the rest, and
# Redis is cache-aside so its absence is never a correctness problem.
#
# There is no vendor hardware on this cluster — no UCS Central, OneView,
# OpenManage, Intersight or reachable BMC — so the five vendor collector
# CronJobs stay disabled and the only one enabled is `fake`, which seeds a
# deterministic fleet through the real ingest pipeline. Turning a vendor
# collector on means turning that one off first: servers correlate on
# (vendor, serial), so two sources fight over the same documents.
#
# ONE out-of-band Secret, `server-scan-db`, holds every credential — both
# database passwords, the cursor-signing HMAC, and the two connection URIs.
# Nothing secret is committed. It must exist BEFORE the first sync or the API
# and both CronJobs stay in CreateContainerConfigError; the exact
# `oc create secret` line is at the top of the chart's values.yaml. Same shape
# as segments-manager-token today, and the ExternalSecret target
# gitops/SECRETS.md already plans for.
#
# Its own namespace, NOT the existing `server-scanner` one: that holds the
# Helmfile `server-scanner-dashboard` release from team-redbull/ServerScanner,
# a different project with a confusingly similar name.
namespace: server-scan

# The one service that creates its own namespace, rather than taking it from
# the `namespaces` Helmfile release every other service uses. Deliberate, and
# scoped here through `overrides:` rather than by flipping the flag in
# appset.yaml — that would change it for every service at once, and the
# appset's own comment explains at length why it is off by default.
#
# Safe for THIS instance: `openshift-gitops` is the operator's default,
# CLUSTER-scoped instance, so its application-controller holds a
# ClusterRoleBinding and may create a Namespace. A NAMESPACED instance
# (this repo previously targeted `user1-argocd`) cannot, and would need a
# ClusterRole for namespaces create/patch first — every sync fails with
# `forbidden` otherwise. It also means the namespace carries no
# `argocd.argoproj.io/managed-by` label, which is a no-op for a cluster-scoped
# instance and would matter for a namespaced one.
#
# The cost is the one the appset warns about generally: two owners for a
# namespace is a race, so `server-scan` is deliberately absent from
# charts/namespaces/values.yaml. Do not add it back.
overrides:
  spec:
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
