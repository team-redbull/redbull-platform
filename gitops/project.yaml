apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: redbull-platform
  namespace: user1-argocd
spec:
  description: team-redbull platform services (CD via the redbull-services ApplicationSet)
  sourceRepos:
    - "*"
  destinations:
    - name: "*"
      namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
