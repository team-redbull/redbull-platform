# Shared globals for the PROD environment. The ApplicationSet lists this file FIRST in
# valueFiles (for every service, prod included), so every service's own values.yaml is
# merged on top (and wins). Keys a given chart doesn't read are harmlessly ignored by
# Helm — this is the place for a value that's genuinely needed across *multiple*
# services' charts in this env.
#
# The bar for landing here is high, and most things don't clear it. The Temporal
# endpoint + orchestrator globals (temporalHost/temporalNamespace/domain/
# segmentsManagerUrl) used to live here, but only one chart (`workflows`) reads them as
# Helm values — segment-connectivity gets the same facts secondhand at runtime, via the
# `workflows-orchestrator-config` ConfigMap that `workflows-orchestrator` publishes. So
# they moved to `gitops/services/prod/workflows/values.yaml`, where they belong to the
# one chart that consumes them.
#
# Prefer that runtime-ConfigMap pattern whenever it works. `siteNetworks` below is here
# precisely because it CANNOT: segments-manager and segment-connectivity run in different
# namespaces (`segments-manager` and `redbull-workflows`), and a ConfigMap is
# namespace-scoped, so neither can mount the other's. Sharing at the Helm-values layer is
# the only way to keep one definition — which is also the layer where the drift actually
# happened, when the two services' site lists were kept in step by a comment.

# ---------------------------------------------------------------------------------
# Site network topology — THE definition. Rendered verbatim into both
# segments-manager's ConfigMap and segment-connectivity's, as SITE_NETWORKS.
#
#   pool  the CIDR every segment at that site must fall INSIDE. segments-manager
#         enforces this on every create (subnet_of), and derives its SITES list
#         from these keys.
#   bmc   the site's static out-of-band management network. segment-connectivity
#         opens one one-directional rule from each MCE segment toward it.
#         segments-manager never reads it per-request — only at startup, to verify
#         no pool collides with a management network.
#
# Both services ignore sub-keys they don't own, so adding one here is safe.
#
# Constraints, all enforced at startup by segments-manager (it refuses to boot
# otherwise): pools must be strict IPv4 CIDRs, must not overlap each other, and must
# not overlap any bmc network. Site names must not differ only by case.
#
# Adding or changing a site here rolls BOTH services' pods on the next Argo sync —
# each chart's Deployment carries a checksum/config annotation over its ConfigMap.
#
# BEFORE changing a `pool`: run segments-manager's
# `scripts/audit_site_pools.py --site-networks '<candidate>'` against prod Mongo.
# The pool rule is enforced only on create and `segment` is immutable, so existing
# out-of-pool segments keep working but become un-recreatable — a CSV re-import or a
# DR restore would be rejected by the rules that let them exist.
siteNetworks:
  site1:
    pool: "192.10.0.0/16"
    bmc: "10.50.0.0/16"
  site2:
    pool: "193.51.0.0/16"
    bmc: "10.51.0.0/16"
  site3:
    pool: "194.52.0.0/16"
    bmc: "10.52.0.0/16"
