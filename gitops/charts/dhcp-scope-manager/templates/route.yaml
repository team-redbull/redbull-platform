{{- if .Values.route.enabled }}
# OpenShift Route. Crossplane provider-http reaches the API through the in-cluster
# Service, so this exists for humans and for out-of-cluster smoke tests, not for
# reconciliation.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "dhcp-scope-manager.fullname" . }}
  labels:
    {{- include "dhcp-scope-manager.labels" . | nindent 4 }}
spec:
  {{- with .Values.route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "dhcp-scope-manager.fullname" . }}
  port:
    targetPort: http
  {{- with .Values.route.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
