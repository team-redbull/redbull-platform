# THE DHCP API bearer token. One value, every placement:
#
#   mgmt cluster — rendered as a subchart of dhcp-scope-manager, beside the API
#   every MCE    — rendered standalone (path: charts/dhcp-api-token), the only
#                  thing that lives there
#
# Both land in the namespace `dhcp-scope-manager`, which templates/token.yaml stamps
# as a literal rather than taking from the release. ONE Secret per cluster, not one
# per hosted cluster: the placeholder in every Request names that fixed namespace,
# and provider-http reads Secrets cluster-wide.
#
# A subchart's own values.yaml is the base of the merge in BOTH cases, so this one
# file configures both with nothing to wire up. That is the whole design.
#
# EACH COPY OF THIS REPO CARRIES ITS OWN ENVIRONMENT'S TOKEN, and this is the only
# line that differs between them — never sync it in either direction. This copy is
# public on GitHub and its token guards the disposable AWS test box only; the
# air-gapped GitLab copy is private and guards the real server.
#
# Rotating: replace the value, commit, then restart the API pod — DHCP_API_TOKEN is
# env, so a running pod keeps its startup value. Generate with
#   LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48
# which is the shape the deleted lookup-then-randAlphaNum generator used.
#
# When ESO + Vault land, this key goes away and templates/token.yaml renders an
# ExternalSecret with the same Secret name and key instead. Nothing that consumes
# the Secret changes. Because git history keeps this value forever, that migration
# must include a rotation.
token: "cEoulp6hoLBSR1edjcWukLGU9kE3XKAgW6EHC47WEiQ7LEKY"
