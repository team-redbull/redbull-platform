apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-lifecycle-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-lifecycle-worker
  labels:
    app: vm-lifecycle-worker
spec:
  replicas: {{ .Values.activityWorker.replicas }}
  selector:
    matchLabels:
      app: vm-lifecycle-worker
  template:
    metadata:
      labels:
        app: vm-lifecycle-worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: vm-lifecycle-worker
      # No Kubernetes API call from this pod: the agents and git only.
      automountServiceAccountToken: false
      # In-flight activities get 20s to finish after SIGTERM (worker_init.py).
      terminationGracePeriodSeconds: 30
      containers:
        - name: vm-lifecycle-worker
          image: "{{ .Values.activityWorker.image.repository }}:{{ .Values.activityWorker.image.tag }}"
          imagePullPolicy: {{ .Values.activityWorker.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: workflows-orchestrator-config
            - configMapRef:
                name: vm-lifecycle-config
            - secretRef:
                name: {{ .Values.secrets.existingDay1Secret | default "day1-git-token" }}
            - secretRef:
                name: {{ .Values.secrets.existingKvCapacitySecret | default "kv-capacity-token" }}
            - secretRef:
                name: {{ .Values.secrets.existingKvVmApiSecret | default "kv-vm-api-token" }}
{{- if .Values.kvAgentCa }}
          volumeMounts:
            - name: kv-agent-ca
              mountPath: /etc/kv-agent-ca
              readOnly: true
      volumes:
        - name: kv-agent-ca
          configMap:
            name: vm-lifecycle-kv-agent-ca
{{- end }}
