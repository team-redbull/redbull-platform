{{- /*
Dedicated ServiceAccounts so nothing runs as the namespace's `default` SA.

- <fullname>     : Temporal server roles + schema/setup Jobs. Never talks to
                   the Kubernetes API, so pods mount no token.
- <fullname>-ui  : the UI pod. With ui.auth it doubles as the OAuth client
                   (redirect URI resolved from the Route via the annotation)
                   and is the identity oauth-proxy / group-sync use against the
                   API — those need a token, so the pod mounts one only then.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "temporal-stack.serviceAccountName" . }}
  labels:
    {{- include "temporal-stack.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.ui.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "temporal-stack.uiServiceAccountName" . }}
  labels:
    {{- include "temporal-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- if .Values.ui.auth.enabled }}
  annotations:
    # Turns this SA into an OAuth client whose redirect URI is resolved from
    # the UI Route at login time — no cluster-scoped OAuthClient needed.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ include "temporal-stack.fullname" . }}-ui"}}
  {{- end }}
automountServiceAccountToken: {{ .Values.ui.auth.enabled }}
{{- if .Values.ui.auth.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "temporal-stack.uiServiceAccountName" . }}-token
  labels:
    {{- include "temporal-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  annotations:
    kubernetes.io/service-account.name: {{ include "temporal-stack.uiServiceAccountName" . }}
# The OAuth server treats the SA above as an OAuth client and resolves its client
# secret by listing this namespace for Secrets of this type whose
# `service-account.name`/`.uid` annotations match it. Finding none aborts the login
# with `server_error` in the browser and `system:serviceaccount:<ns>:<sa> has no
# tokens` in the openshift-authentication pods — a failure that looks like a broken
# oauth-proxy config rather than a missing Secret.
#
# Relying on the cluster to supply one implicitly is what makes that reachable:
# OpenShift 4.16+ stopped auto-creating SA token Secrets altogether
# (LegacyServiceAccountTokenNoAutoGeneration), and even on older clusters the
# auto-created Secret goes missing whenever the SA is deleted and recreated (a Helm
# reinstall, or an Argo CD prune) — the stale Secret keeps the previous UID and no
# longer matches — or when a hardening policy prunes long-lived tokens. Owning it
# here makes it deterministic on every version.
#
# `data.token` is deliberately absent: the token controller fills it in, and leaving
# the field unset means neither Helm nor Argo CD ever clobbers what it wrote.
type: kubernetes.io/service-account-token
{{- end }}
{{- end }}
