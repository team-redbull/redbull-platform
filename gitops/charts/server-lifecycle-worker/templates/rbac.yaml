{{- /*
What install-server, remove-server and publish-infraenv-boot write, read and
roll back — and nothing more.

STILL NO `update`. The workflow never overwrites an existing resource: it treats
"already exists" as success once the contents match and raises a conflict when
they do not, so the absence of that verb is the design enforced rather than
merely documented.

`delete` and `patch` on baremetalhosts ARE needed, and the reason is the retry
loop rather than an uninstall. A candidate that never registers an Agent is
rolled back so the NEXT candidate can be tried — leaving its BareMetalHost
behind would strand that machine, invisibly: server-scan reports a server
unclaimed until a cluster reports the node, so no other MCE would know the
machine was taken. `patch` covers both halves of that rollback, and both were
established against a live cluster:

  * the `baremetalhost.metal3.io/detached` annotation, which must be applied
    BEFORE the delete — after `deletionTimestamp` is set it does nothing;
  * dropping metal3's `baremetalhost.metal3.io` finalizer when it will not
    release. It blocks while trying to deprovision through the BMC, and a
    rollback happens precisely because that BMC never answered — measured stuck
    past four minutes, in state `deleting`, with no error ever reported.

`delete` on secrets is a fallback only. The BMC Secret carries an
ownerReference to the BareMetalHost, so the garbage collector normally takes it;
without this verb, the case where it does not leaves a BMC credential on the
cluster after every rollback.

`list` on agents is the one read that proves an install worked. An Agent exists
because the host booted the discovery ISO and reached assisted-service, and it
must be found by MAC — BMAC names an Agent after the host's inventory UUID and
its spec holds no reference back to the BareMetalHost — so a `get` by name
cannot do it. This is the only place the limb lists anything; every other
access still addresses one object by name.

`delete` on agents is remove-server's. It deletes a host's Agent LAST — after
powering the host off and removing its BareMetalHost and NMStateConfig — because
a host still running discovery re-registers a deleted Agent within a minute.
It refuses, changing nothing, while the Agent is bound to a cluster.

`patch` on agents is uninstall-server's, for an Agent the Agent provider can no
longer release: the provider unbinds only from a Machine's pre-terminate hook,
so when a broken HyperShift deletion left the Agent bound with its Machine or
AgentMachine gone, the run makes the provider's own write (label, namespace
annotation, machineConfigPool, ignition token, clusterDeploymentName). It
refuses an Agent bound to any other cluster.

`get` on infraenvs is the InfraEnv pre-check (install-server's
`validating-infraenv`, publish-infraenv-boot's `check_infra_env`), and the wait
for the discovery image to include a new NMStateConfig before an IPMI host's
PXE boot entry is published. Without it every install fails at that first step
with a 403 — found on the 2qsc5 hub on 2026-10-23, where this list had fallen
behind the workflows chart it is vendored from.

uninstall-server reaches further, so `rbac.hostedClusters` adds a SEPARATE
ClusterRole (`server-lifecycle-worker-hosted-clusters`, whatever
`rbac.clusterWide` says). What it touches lives in each hosted cluster's
control-plane namespace (`<hc-ns>-<hc>`) and the HostedCluster's own namespace
— neither is an InfraEnv namespace, and neither is named in the request:

  * machines (cluster.x-k8s.io): get + delete the CAPI Machine behind the
    host's Agent; list, to find it by providerID or infrastructureRef when
    its AgentMachine is gone; patch, to remove the Agent provider's
    pre-terminate hook from such a Machine — the provider can never remove it
    without the AgentMachine, so the Machine would never finish deleting.
  * agentmachines (capi-provider.agent-install.openshift.io): list, to find
    the one whose `status.agentRef` names the Agent — the only link left once
    the Agent provider starts unbinding it — and get, to confirm it went;
    delete, for one left with no Machine; patch, to drop the provider's own
    finalizer from one stuck deleting with no Machine (it drops it only
    through a Machine).
  * hostedclusters (hypershift.openshift.io): list, to find the HostedCluster
    by its control-plane namespace, and get, for its `status.kubeconfig`.
  * secrets: get, for that admin kubeconfig, through which the run checks the
    hosted cluster no longer has the server's Node. This is the WIDEST grant
    the worker holds — get on every Secret of the cluster. Turn
    `rbac.hostedClusters` off where no hosted cluster runs; uninstall-server
    then fails the inspection of any host with an Agent (403, nothing
    written), and remove-server is the way to take inventory hosts out.

Namespace-scoped by default, because the namespace to write into is a REQUEST
field. A ClusterRole would let any caller of the install-server API create a
Secret in any namespace in the cluster; a Role per declared namespace bounds
that to the InfraEnvs you have actually deployed.
*/ -}}
{{- $rules := list
  (dict "apiGroups" (list "") "resources" (list "secrets") "verbs" (list "get" "create" "delete"))
  (dict "apiGroups" (list "metal3.io") "resources" (list "baremetalhosts") "verbs" (list "get" "create" "delete" "patch"))
  (dict "apiGroups" (list "agent-install.openshift.io") "resources" (list "nmstateconfigs") "verbs" (list "get" "create" "delete"))
  (dict "apiGroups" (list "agent-install.openshift.io") "resources" (list "agents") "verbs" (list "get" "list" "delete" "patch"))
  (dict "apiGroups" (list "agent-install.openshift.io") "resources" (list "infraenvs") "verbs" (list "get"))
-}}
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-lifecycle-worker
rules:
{{ toYaml $rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-lifecycle-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-lifecycle-worker
subjects:
  - kind: ServiceAccount
    name: server-lifecycle-worker
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $namespace := .Values.rbac.targetNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-lifecycle-worker
  namespace: {{ $namespace }}
rules:
{{ toYaml $rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-lifecycle-worker
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: server-lifecycle-worker
subjects:
  - kind: ServiceAccount
    name: server-lifecycle-worker
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.rbac.hostedClusters }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-lifecycle-worker-hosted-clusters
rules:
  - apiGroups: [cluster.x-k8s.io]
    resources: [machines]
    verbs: [get, list, delete, patch]
  - apiGroups: [capi-provider.agent-install.openshift.io]
    resources: [agentmachines]
    verbs: [get, list, delete, patch]
  - apiGroups: [hypershift.openshift.io]
    resources: [hostedclusters]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-lifecycle-worker-hosted-clusters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-lifecycle-worker-hosted-clusters
subjects:
  - kind: ServiceAccount
    name: server-lifecycle-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
