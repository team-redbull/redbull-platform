config:
  # WHICH MCE THIS DEPLOYMENT SERVES. It names the activity queue the worker
  # polls (server-lifecycle-activity-<mceCluster>), so it must equal the
  # `mce_cluster` callers send to install-server — the same string the Segments
  # Manager holds as that inventory segment's cluster_name.
  #
  # This is the whole cross-cluster mechanism: the brain runs on the hub and
  # picks a target MCE purely by which queue it dispatches to, so one worker
  # runs INSIDE each MCE and writes only to its own API server, as its own
  # ServiceAccount. No kubeconfig for another cluster exists anywhere, and
  # because the worker dials OUT to Temporal the hub needs no inbound access to
  # any MCE.
  #
  # Getting it wrong is undetectable at runtime — the worker would serve
  # another MCE's installs and create their BareMetalHosts here, both halves
  # succeeding — so it has no default and every deployment must state it.
  mceCluster: ""
  # server-scan's inventory API, INCLUDING the /api/v1 prefix — the worker
  # appends only /servers/available to it. Reachable from inside each MCE: it
  # is a central service, like Temporal.
  serverScanUrl: "http://server-scan-api.server-scan.svc.cluster.local/api/v1"
secrets:
  # The BMC credentials Ironic will use to drive each vendor's BMC, plus an
  # optional server-scan token. Point existingSecret at a Secret managed outside
  # this chart (the normal case) and the chart creates nothing; leave it empty
  # and the dev placeholders below are templated into one.
  existingSecret: "server-lifecycle-credentials"
  serverScanApiToken: ""
  hpBmcUsername: ""
  hpBmcPassword: ""
  dellBmcUsername: ""
  dellBmcPassword: ""
  ciscoBmcUsername: ""
  ciscoBmcPassword: ""
  intersightBmcUsername: ""
  intersightBmcPassword: ""
rbac:
  # Namespaces this worker may write a BareMetalHost into. The request body
  # names the namespace, so this list is what bounds it: an install aimed
  # anywhere else is refused by the API server with 403, which the workflow
  # classifies as a non-retryable deployment gap rather than retrying forever.
  #
  # It must be the namespace the target InfraEnv lives in — BMAC only binds a
  # BareMetalHost to an InfraEnv in its OWN namespace. Add a namespace here
  # when you add an InfraEnv there.
  targetNamespaces:
    - multicluster-engine
    - bmh-workflow-test
    - lab-kv
  # Grant cluster-wide instead of per-namespace. Only for an environment with
  # too many InfraEnv namespaces to enumerate: it lets any caller of the
  # install-server API create a Secret in ANY namespace, since the namespace is
  # a request field.
  clusterWide: false
activityWorker:
  image:
    repository: ghcr.io/team-redbull/server-lifecycle-worker
    tag: v1.0.0
    pullPolicy: IfNotPresent
  replicas: 2
