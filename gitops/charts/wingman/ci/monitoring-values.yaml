# helm template fixture: every monitoring object on.
# Every fixture sets the Wingman tags: the chart has no default (ADR-0059).
image:
  day1: { tag: "3.33.0" }
  day2: { tag: "3.33.0" }
  web: { tag: "3.33.0" }
# The orchestrator every create starts provision-cluster on (ADR-0042), and
# the server-scan its uninstall needs.
workflows: { url: "http://workflows-orchestrator-api.ns.svc:8080" }
serverScan: { url: "http://server-scan-api.ns.svc:8000" }
monitoring:
  serviceMonitor: { enabled: true, labels: { team: platform } }
  prometheusRule: { enabled: true }
  grafanaDashboard: { enabled: true, namespace: grafana }
