# helm template fixture: a deployment from a Git repository that holds no
# secret (redbull-platform's ApplicationSet, ADR-0070). day1 and day2 read an
# existing Secret and the OAuthClient is created by hand, so the chart renders
# neither; every secret value stays empty. Plus what the chart requires (the
# image tags and the orchestrator with its server-scan, as default-values.yaml).
image:
  day1: { repository: ghcr.io/team-redbull/wingman-day1, tag: "3.33.0" }
  day2: { repository: ghcr.io/team-redbull/wingman-day2, tag: "3.33.0" }
  web: { repository: ghcr.io/team-redbull/wingman-web, tag: "3.33.0" }
workflows: { url: "http://workflows-orchestrator-api.ns.svc:8080" }
serverScan: { url: "http://server-scan-api.ns.svc:8000" }
secrets:
  existingSecret: wingman-credentials
auth:
  oauthClient:
    create: false
