{{- $existing := include "wingman.existingSecret" . -}}
{{- if $existing }}
{{- /* The Secret exists already (ADR-0070): a secret in the values would be
ignored, and the OAuthClient would need one inline. Refuse both, naming them. */ -}}
{{- range $key, $value := dict "gitlab.accessToken" .Values.gitlab.accessToken "gitlab.webhookSecret" .Values.gitlab.webhookSecret "auth.oauthClientSecret" .Values.auth.oauthClientSecret "auth.jwtSecret" .Values.auth.jwtSecret "devAuth.secret" .Values.devAuth.secret }}
{{- if $value }}
{{- fail (printf "%s is set, but secrets.existingSecret names the Secret day1 and day2 read (%s): delete it from the values, the Secret holds it (values.yaml's SECRETS)" $key $existing) }}
{{- end }}
{{- end }}
{{- if include "wingman.rendersOAuthClient" . }}
{{- fail (printf "auth.oauthClient.create needs auth.oauthClientSecret in the values, and secrets.existingSecret (%s) holds it instead: set auth.oauthClient.create=false and create the OAuthClient once by hand (values.yaml's SECRETS)" $existing) }}
{{- end }}
{{- else -}}
apiVersion: v1
kind: Secret
metadata:
  name: wingman-secrets
  namespace: {{ include "wingman.namespace" . }}
  labels:
    {{- include "wingman.labels" . | nindent 4 }}
type: Opaque
stringData:
  # GitLab service account token (wingman_core GitLabSettings: GITLAB_TOKEN)
  GITLAB_TOKEN: {{ .Values.gitlab.accessToken | quote }}

  # JWT signing secret
  JWT_SECRET_KEY: {{ .Values.auth.jwtSecret | quote }}

  # OpenShift OAuth client secret (empty when devAuth.enabled)
  OPENSHIFT_OAUTH_CLIENT_SECRET: {{ .Values.auth.oauthClientSecret | quote }}

  # GitLab webhook verification secret
  GITLAB_WEBHOOK_SECRET: {{ .Values.gitlab.webhookSecret | quote }}

  # Dev auth secret (empty when devAuth.enabled=false)
  DEV_AUTH_SECRET: {{ .Values.devAuth.secret | quote }}
{{- end }}
