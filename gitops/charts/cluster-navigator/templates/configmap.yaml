apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "navigator.name" . }}
  labels:
    {{- include "navigator.labels" . | nindent 4 }}
data:
  DB_NAME: {{ .Values.mongo.dbName | quote }}
  REPORT_TTL_DAYS: {{ .Values.mongo.reportTtlDays | quote }}
  STALE_AFTER_SECONDS: {{ .Values.staleAfterSeconds | quote }}
  CONSOLE_CHECK_INTERVAL_SECONDS: {{ .Values.consoleCheckIntervalSeconds | quote }}
  GRAFANA_URL_TEMPLATE: {{ .Values.grafanaUrlTemplate | default "" | quote }}
  ADMIN_GROUPS: {{ .Values.auth.adminGroups | default list | toJson | quote }}
  {{- if .Values.auth.roles }}
  ROLES: {{ .Values.auth.roles | toJson | quote }}
  {{- end }}
  {{- range $role, $members := .Values.auth.roleGroups }}
  {{ upper $role }}_GROUPS: {{ $members | default list | toJson | quote }}
  {{- end }}
  GROUP_CACHE_SECONDS: {{ .Values.auth.groupCacheSeconds | quote }}
  SESSION_TTL_HOURS: {{ .Values.auth.sessionTtlHours | quote }}
  COOKIE_SECURE: "true"
  {{- if .Values.auth.oauthInsecureSkipVerify }}
  OPENSHIFT_OAUTH_INSECURE_SKIP_VERIFY: "true"
  {{- end }}
  {{- with (.Values.route | default dict).host }}
  PUBLIC_URL: "https://{{ . }}"
  {{- end }}
