{{- if and (eq .Values.auth.provider "openshift") (not .Values.route.enabled) -}}
{{- fail "auth.provider=openshift needs route.enabled: the OAuth redirect goes to the Route" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "navigator.name" . }}
  labels:
    {{- include "navigator.labels" . | nindent 4 }}
data:
  DB_NAME: {{ .Values.mongo.dbName | quote }}
  REPORT_TTL_DAYS: {{ .Values.mongo.reportTtlDays | quote }}
  PRIMARY_SEGMENT_TYPES: {{ join "," .Values.primarySegmentTypes | quote }}
  STALE_AFTER_SECONDS: {{ .Values.staleAfterSeconds | quote }}
  GRAFANA_URL_TEMPLATE: {{ .Values.grafanaUrlTemplate | quote }}
  AUTH_PROVIDER: {{ .Values.auth.provider | quote }}
  ADMIN_GROUPS: {{ join "," .Values.auth.adminGroups | quote }}
  {{- if .Values.auth.roles }}
  ROLES: {{ .Values.auth.roles | toJson | quote }}
  {{- end }}
  {{- range $role, $members := .Values.auth.roleGroups }}
  {{ upper $role }}_GROUPS: {{ join "," $members | quote }}
  {{- end }}
  GROUP_CACHE_SECONDS: {{ .Values.auth.groupCacheSeconds | quote }}
  SESSION_TTL_HOURS: {{ .Values.auth.sessionTtlHours | quote }}
  COOKIE_SECURE: "true"
  {{- if .Values.route.host }}
  PUBLIC_URL: "https://{{ .Values.route.host }}"
  {{- end }}
