apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "navigator.name" . }}
  labels:
    {{- include "navigator.labels" . | nindent 4 }}
  annotations:
    # Makes this ServiceAccount an OAuth client whose allowed redirect is the
    # Route below. No OAuthClient object is needed.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ include "navigator.name" . }}"}}
---
# The OAuth server resolves a ServiceAccount client by listing this namespace for
# Secrets of this type that name the ServiceAccount. With none, every token
# exchange is refused with `unauthorized_client`, after the user has typed a
# password. OpenShift 4.16+ no longer creates one by itself, so the chart does.
# `data.token` is left out on purpose: the token controller fills it, and
# neither Helm nor Argo CD then overwrites what it wrote. Same as the temporal
# chart in redbull-platform.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "navigator.name" . }}-oauth-client
  labels:
    {{- include "navigator.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "navigator.name" . }}
type: kubernetes.io/service-account-token
