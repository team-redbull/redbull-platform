{{- if not .Values.secret.existingSecret }}
{{- $name := include "navigator.name" . -}}
{{- $session := .Values.secret.sessionSecret -}}
{{- if not $session -}}
  {{- /* Keep the generated value across upgrades, or every upgrade would sign everyone out. */ -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
  {{- if and $existing $existing.data (index $existing.data "SESSION_SECRET") -}}
    {{- $session = index $existing.data "SESSION_SECRET" | b64dec -}}
  {{- else -}}
    {{- $session = randAlphaNum 48 -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "navigator.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_URI: {{ required "secret.mongoUri or secret.existingSecret is required" .Values.secret.mongoUri | quote }}
  INGEST_TOKEN: {{ required "secret.ingestToken or secret.existingSecret is required" .Values.secret.ingestToken | quote }}
  SESSION_SECRET: {{ $session | quote }}
  {{- if .Values.secret.serviceTokens }}
  SERVICE_TOKENS: {{ .Values.secret.serviceTokens | toJson | quote }}
  {{- end }}
{{- end }}
