apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "collector.name" . }}
  labels:
    {{- include "collector.labels" . | nindent 4 }}
---
# Read-only, and only the objects the collector reports on. It creates nothing
# in the cluster and needs no privileged SCC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "collector.name" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "collector.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions", "infrastructures", "dnses", "ingresses", "consoles", "oauths"]
    verbs: ["get", "list"]
  # Type detection: is this an MCE, does it run OpenShift Virtualization.
  - apiGroups: ["multicluster.openshift.io"]
    resources: ["multiclusterengines"]
    verbs: ["get", "list"]
  - apiGroups: ["hco.kubevirt.io"]
    resources: ["hyperconvergeds"]
    verbs: ["get", "list"]
  # On an MCE: which clusters it hosts.
  - apiGroups: ["hypershift.openshift.io"]
    resources: ["hostedclusters", "nodepools"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "collector.name" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "collector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "collector.name" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "collector.name" . }}
    namespace: {{ .Release.Namespace }}
