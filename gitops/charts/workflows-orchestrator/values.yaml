# Values for `workflows-orchestrator`, deployed by the redbull-services ApplicationSet
# (gitops/services/workflows-orchestrator/app.yaml). THIS FILE IS THE SINGLE SOURCE OF
# TRUTH for how the brain is configured — there is no second values file layered on top
# of it. gitops/overrides/ exists for a site- or cluster-specific override, and nothing
# uses it today.
#
# config.* therefore holds the IN-CLUSTER endpoints, not the local-kind
# host.docker.internal defaults this chart shipped with while it lived in its own repo.
# Change Temporal's address/namespace or the orchestrator's domain / Segments Manager URL
# here, once, for the whole workflow layer — every limb reads them at runtime from the
# workflows-orchestrator-config ConfigMap this chart publishes, so no other chart has
# its own copy.
#
# image.repository/tag are CI-owned: the workflows repo's build workflow commits the
# bump here on every push to its main. Do not hand-edit them.
#
# This chart owns `workflows-orchestrator-config`, the GLOBAL ConfigMap shared by every
# workflow domain: the Temporal connection plus the domain tag and Segments
# Manager URL that all domains reuse. The brain itself only needs TEMPORAL_*;
# domain/segmentsManagerUrl live here so activity limbs (e.g. segment-lifecycle) can
# mount this one ConfigMap instead of each duplicating those values.
#
# This chart never creates or names a Namespace: it deploys into whichever
# namespace the release targets (`helm install -n <ns>`, or the release's
# `namespace:` field in redbull-platform's helmfile). On redbull-platform that
# namespace (redbull-workflows) is pre-created by its own `namespaces` release;
# standalone, pass `--create-namespace` to `helm install`.

config:
  # The Temporal frontend deployed by the Argo-managed `temporal` app, in its own
  # namespace. A SOFT dependency: this brain crash-loops until Temporal is up, then
  # connects — retry/selfHeal covers it, which is why the two apps carry no sync waves
  # relative to each other.
  temporalHost: "temporal-frontend.temporal.svc.cluster.local:7233"
  temporalNamespace: "default"
  # Segments Manager base URL, shared by every domain's activities. Cross-namespace:
  # traffic flows redbull-workflows -> segments-manager only (the reverse call was
  # removed when the workflow became the caller).
  segmentsManagerUrl: "http://segments-manager.segments-manager.svc.cluster.local:8000"
  # Operator "domain" tag stamped into workflow payloads (e.g. next open-rules).
  domain: "domain1"
image:
  repository: ghcr.io/team-redbull/workflows
  tag: v0.1.19
  pullPolicy: IfNotPresent
replicas: 2
# The SHARED workflow trigger API (workflow_domains/api.py), run from the same image
# as a single Deployment + Service named `workflows-orchestrator-api` that fronts
# EVERY workflow domain and every workflow within it (a new domain adds a router
# to workflow_domains/api.py, not a new pod). Its URL PATHS are per WORKFLOW under a
# domain prefix (/workflows/segment-lifecycle/open-segment-rules, status on
# /workflows/runs/{workflow_id}) even though the resources are named after the
# orchestrator — the path is the public API and does not move.
#
# This is the operator's front door, not a service-to-service endpoint: nothing
# calls in from another service any more (the Segments Manager used to, and no
# longer does — the workflow calls IT).
workflowsApi:
  enabled: true
  replicas: 2
  port: 8080
  # OpenShift Route fronting the Service above. Needed because triggering a
  # workflow is an operator-initiated HTTP call (and /docs is the UI for it),
  # so the API must be reachable from outside the cluster. The API is
  # UNAUTHENTICATED — disable this (and port-forward instead) anywhere that
  # matters. Ignored on plain kubernetes/kind, which has no Route CRD.
  route:
    enabled: true
    # Empty host = OpenShift generates one from route/namespace/cluster domain.
    host: ""
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
