# The lightweight "brain": runs workflows only, for every workflow domain
# registered in workflow_domains/main_worker_init.py. Its own ServiceAccount per the
# RBAC-isolation requirement (no Segments Manager token, no next URLs mounted —
# it never makes those calls; activities do).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflows-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflows-orchestrator
  labels:
    app: workflows-orchestrator
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: workflows-orchestrator
  template:
    metadata:
      labels:
        app: workflows-orchestrator
    spec:
      serviceAccountName: workflows-orchestrator
      containers:
        - name: workflows-orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: workflows-orchestrator-config
