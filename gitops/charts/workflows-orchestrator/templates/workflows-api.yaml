apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflows-orchestrator-api
  labels:
    app: workflows-orchestrator-api
spec:
  replicas: {{ .Values.workflowsApi.replicas }}
  selector:
    matchLabels:
      app: workflows-orchestrator-api
  template:
    metadata:
      labels:
        app: workflows-orchestrator-api
    spec:
      serviceAccountName: workflows-orchestrator
      containers:
        - name: workflows-orchestrator-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "workflow_domains.api:app", "--host", "0.0.0.0", "--port", "{{ .Values.workflowsApi.port }}"]
          envFrom:
            - configMapRef:
                name: workflows-orchestrator-config
          ports:
            - name: http
              containerPort: {{ .Values.workflowsApi.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.workflowsApi.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workflows-orchestrator-api
  labels:
    app: workflows-orchestrator-api
spec:
  selector:
    app: workflows-orchestrator-api
  ports:
    - name: http
      port: {{ .Values.workflowsApi.port }}
      targetPort: {{ .Values.workflowsApi.port }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: workflows-orchestrator-api
  labels:
    app: workflows-orchestrator-api
spec:
  {{- with .Values.workflowsApi.route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: workflows-orchestrator-api
  port:
    targetPort: http
  {{- with .Values.workflowsApi.route.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
