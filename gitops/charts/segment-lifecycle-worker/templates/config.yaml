apiVersion: v1
kind: ConfigMap
metadata:
  name: segment-lifecycle-config
data:
  DHCP_API_URL: {{ .Values.config.dhcpApiUrl | quote }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: segments-manager-token
type: Opaque
stringData:
  SEGMENTS_MANAGER_API_TOKEN: {{ .Values.secrets.segmentsManagerApiToken | quote }}
{{- end }}
{{- if not .Values.secrets.existingDhcpSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dhcp-api-token
type: Opaque
stringData:
  DHCP_API_TOKEN: {{ .Values.secrets.dhcpApiToken | quote }}
{{- end }}
