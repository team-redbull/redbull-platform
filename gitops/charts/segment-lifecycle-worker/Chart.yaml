apiVersion: v2
name: segment-lifecycle-worker
description: >-
  The segment-lifecycle domain's activity worker — creates, allocates and releases segments in the Segments Manager, writes their DHCP blocks to the day1 values repo, and deletes a released cluster's orphaned DHCP scope. Named for the process, not the domain: it polls the domain-scoped segment-lifecycle-activity queue on behalf of every workflow in the domain. Deploys alongside the shared workflows-orchestrator chart, which runs the workflow brain.
type: application
version: 0.1.65
appVersion: "v0.1.65"
