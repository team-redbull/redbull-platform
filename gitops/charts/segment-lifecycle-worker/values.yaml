siteNetworks:
  site1:
    pool: "192.10.0.0/16"
    dell-bmc: "10.50.0.0/16"
    cisco-bmc: "10.60.0.0/16"
  site2:
    pool: "193.51.0.0/16"
    dell-bmc: "10.51.0.0/16"
    cisco-bmc: "10.61.0.0/16"
  site3:
    pool: "194.52.0.0/16"
    dell-bmc: "10.52.0.0/16"
    cisco-bmc: "10.62.0.0/16"
config:
  nextUrl: "http://mock-segment-connectivity.redbull-workflows.svc.cluster.local:9000"
  nextTokenRenewalUri: "/token-renewal-uri"
  nextOpenRulesUri: "/open-rules-uri"
  nextCheckStatusUri: "/check-request-status"
  nextGroup: "dev-group"
  nextCheckingRequestIntervalSeconds: 15
  ports:
    hcToMce:
      tcp: ["30000-32767"]
      udp: ["9000"]
    mceToHc:
      tcp: ["6443", "30000-32767"]
    inventoryToMce:
      tcp: ["30000-32767"]
      udp: ["9000"]
    mceToInventory:
      tcp: ["6443", "30000-32767"]
    # No pxeToMce/mceToPxe: no connectivity is opened for PXE segments (the
    # workflow rejects a PXE input outright). These profiles ARE the peering
    # topology, so a profile here would put MCE<->PXE rules back.
    mceToBmc:
      tcp: ["623"]
      udp: ["623"]
  day1RepoUrl: "https://github.com/team-redbull/gitops-day1-platform-config.git"
  day1Branch: "main"
  dhcpApiUrl: "http://dhcp-scope-manager.dhcp-scope-manager.svc.cluster.local:8080"
  dhcpExclusionOctetRanges:
    HC:
      - [1, 10]
      - [241, 254]
secrets:
  existingSecret: "segments-manager-token"
  segmentsManagerApiToken: "dev-token"
  # The next API's token-renewal credentials. Empty existingNextSecret, so the
  # chart renders `next-api-credentials` from the two values below — the
  # plaintext-in-values shape SECRETS.md inventories for the ESO migration.
  # Point existingNextSecret at an out-of-band Secret (keys NEXT_CLIENT_ID /
  # NEXT_PASSWORD) to take these out of git before then.
  existingNextSecret: ""
  nextClientId: "dev-client"
  nextPassword: "dev-password"
  existingDay1Secret: "day1-git-token"
  day1GitToken: "dev-token"
activityWorker:
  image:
    repository: ghcr.io/team-redbull/segment-lifecycle-worker
    tag: v0.1.25
    pullPolicy: IfNotPresent
  replicas: 2
