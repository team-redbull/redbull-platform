apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kvvm.fullname" . }}
  labels:
    {{- include "kvvm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "kvvm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kvvm.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        checksum/template: {{ include (print $.Template.BasePath "/vm-template.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "kvvm.fullname" . }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: kv-vm-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kvvm.fullname" . }}-config
            - secretRef:
                name: {{ .Values.config.existingSecret | default "kv-vm-api-token" }}
          volumeMounts:
            - name: vm-template
              mountPath: /app/templates
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: vm-template
          configMap:
            name: {{ include "kvvm.fullname" . }}-template
