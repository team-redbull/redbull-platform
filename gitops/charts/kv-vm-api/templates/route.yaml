{{- if .Values.route }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "kvvm.fullname" . }}
  labels:
    {{- include "kvvm.labels" . | nindent 4 }}
spec:
  {{- with .Values.route.host }}
  host: {{ . | quote }}
  {{- end }}
  port:
    targetPort: http
  to:
    kind: Service
    name: {{ include "kvvm.fullname" . }}
    weight: 100
  tls:
    termination: {{ .Values.route.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.insecureEdgeTerminationPolicy }}
{{- end }}
