# The identity ESO presents to Vault (ClusterSecretStore auth.kubernetes.serviceAccountRef).
# ESO's controller mints a short-lived token for it via the TokenRequest API on every
# login; nothing long-lived is stored anywhere. Vault's role on auth/k8s-<clusterName>
# binds exactly this name + namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vault.serviceAccount }}
  namespace: {{ .Release.Namespace }}
{{- if .Values.vault.authDelegator }}
---
# Lets Vault call TokenReview on THIS cluster using the login token itself (remote
# clusters keep no reviewer JWT in Vault). Grants nothing but tokenreviews/
# subjectaccessreviews create.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.vault.serviceAccount }}-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ .Values.vault.serviceAccount }}
    namespace: {{ .Release.Namespace }}
{{- end }}
