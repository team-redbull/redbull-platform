# The one store every ExternalSecret on this cluster references:
#   secretStoreRef: { kind: ClusterSecretStore, name: vault }
# Its Vault policy (cluster-<clusterName>) is what scopes it — kv/shared/* plus this
# cluster's own kv/clusters/<clusterName>/*; see charts/vault/scripts/configure.sh.
#
# Sync wave 1: the CRD comes from the subchart in wave 0. SkipDryRunOnMissingResource
# because on the very first sync the CRD does not exist yet when Argo dry-runs.
{{- if .Values.vault.createClusterSecretStore }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: {{ required "vault.server is required" .Values.vault.server | quote }}
      path: {{ .Values.vault.path | quote }}
      version: v2
      {{- with .Values.vault.caConfigMap }}
      caProvider:
        type: ConfigMap
        name: {{ . }}
        key: {{ $.Values.vault.caKey }}
        namespace: {{ $.Release.Namespace }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ printf "k8s-%s" (required "clusterName is required" .Values.clusterName) | quote }}
          role: {{ .Values.vault.role | quote }}
          serviceAccountRef:
            name: {{ .Values.vault.serviceAccount }}
            namespace: {{ .Release.Namespace }}
            audiences:
              - {{ .Values.vault.audience | quote }}
              {{- with .Values.vault.apiServerAudience }}
              - {{ . | quote }}   # see values.yaml: remote TokenReview needs it
              {{- end }}
{{- end }}
