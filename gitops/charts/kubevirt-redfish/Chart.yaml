apiVersion: v2
name: kubevirt-redfish
description: >-
  KubeVirt Redfish (Technology Preview) — a Redfish-compatible API in front of
  OpenShift Virtualization VMs, so BMC-oriented tooling (Metal3/BareMetalHost,
