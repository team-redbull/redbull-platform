# KubeVirt Redfish — Technology Preview.
#
# Exposes OpenShift Virtualization VMs through a Redfish-compatible API (power,
# inventory, VirtualMedia). Deliberately its OWN chart and Argo app, separate from
# `openshift-virtualization`: a Technology Preview component churns on a different
# cadence than the CNV operator install, and the dependency between them is SOFT —
# with CNV absent this app still applies cleanly and the pod recovers on its own via
# the appset's retry/selfHeal once CNV is up. No sync-wave coupling, no shared
# failure. See CLAUDE.md.
#
# ── ONE out-of-band Secret is required before the first sync ──────────────────
# The Redfish config carries a bcrypt password hash that grants FULL management
# control over every VM it exposes, independently of any OpenShift RBAC. It is NOT
# committed here (this repo's GitHub copy is public; a bcrypt hash in git is an
# offline brute-force target forever). Create it by hand, once per cluster:
#
#   htpasswd -nbB "" '<password>' | cut -d: -f2      # → $2y$05$…  (the hash)
#
#   # Do NOT hand-copy the `config:` block below — it is camelCase Helm values, while the
#   # file the binary parses is snake_case with a `server:` stanza. Render the real thing:
#   #   helm template kubevirt-redfish . -f my-values.yaml -s templates/secret.yaml
#   # (my-values.yaml = the `config:` block with existingSecret "", never committed), then
#   # lift stringData.config.yaml out of it into ./config.yaml and:
#   oc create secret generic kubevirt-redfish-secret \
#     -n kubevirt-redfish --from-file=config.yaml=./config.yaml
#
# Until it exists the Deployment stays in ContainerCreating. Same shape as
# `server-scan-db` and `segments-manager-token`; see gitops/SECRETS.md.
# Set config.existingSecret to "" to have this chart render the Secret from the
# values below instead — dev clusters only, it puts the hash in git.
# ──────────────────────────────────────────────────────────────────────────────

# NO `namespace` value, deliberately. Every template omits metadata.namespace, so its
# objects land in the Application's destination.namespace — `namespace:` in
# gitops/services/kubevirt-redfish/app.yaml here, `projectNamespace` under the day2
# platform — which this chart now REQUIRES: day2's deployApp omits destination.namespace
# entirely when projectNamespace is unset, and these objects would land in `default`.
# One place states the namespace instead of two that must agree; a mismatch
# used to mean Argo created one namespace while the manifests targeted another. This is
# also what every other workload chart in this repo already does.
#
# The ONE namespace reference left is the ClusterRoleBinding's SUBJECT namespace, which
# uses .Release.Namespace (Argo sets it to that same destination). That is a field in the
# object BODY, not metadata — Argo does not rewrite it, so it cannot simply be omitted,
# and getting it wrong is silent: the app reports Synced/Healthy and the pod 403s on
# every VM. Same pattern as temporal/templates/ui-rbac.yaml.
#
# The namespace must already exist: `kubevirt-redfish` is pre-created by the `namespaces`
# Helmfile release and CreateNamespace is off in the appset (see gitops/appset.yaml).

# NO name values. Every object is named from the RELEASE name via the `redfish.fullname`
# helper — `kubevirt-redfish` under both the redbull-platform appset and the day2 platform,
# which set releaseName to the service/chart folder name. The ServiceAccount takes that name,
# the ClusterRole adds `-role` and the ClusterRoleBinding `-binding`.
#
# This is not only deduplication: the ClusterRole/ClusterRoleBinding are CLUSTER-scoped, and
# as fixed literals a second install of this chart on the same cluster silently collided on
# them. Derived from the release name, two installs cannot clash.
#
# See templates/_helpers.tpl — and do NOT set day2's `oldConvention: true` for this chart.

image:
  # AIR-GAPPED: verify this image is actually in your mirror. It ships in the CNV
  # bundle's relatedImages on a connected cluster, but if `oc mirror` did not pull
  # it, add it to ImageSetConfiguration.mirror.additionalImages.
  # Note it is referenced BY TAG: an ImageDigestMirrorSet does not redirect tag
  # pulls. You need an ImageTagMirrorSet covering registry.redhat.io, or point
  # `repository` straight at the mirror host below.
  repository: registry.redhat.io/container-native-virtualization/kubevirt-redfish-rhel9
  tag: v4.22
  pullPolicy: Always

replicas: 1
port: 8443
logLevel: info

resources:
  requests:
    memory: 512Mi
    cpu: 100m
  limits:
    memory: 2Gi
    cpu: 500m

# The Route exists because this block does — there is no `enabled` flag. Delete it, or set
# `route: null` in a higher values layer, to deploy without one (Helm's coalesce drops a key
# set to null; `route: {}` would still render a Route).
route:
  # Empty → the ingress controller generates the hostname.
  host: ""
  # Edge termination: TLS stops at the router, the backend is plain HTTP
  # (config.server.tls.enabled is false below, matching the Red Hat procedure).
  termination: edge
  insecureEdgeTerminationPolicy: Redirect

config:
  # Name of the Secret holding config.yaml. Created out-of-band (see header).
  # Set to "" to render it from the values below instead — dev only.
  existingSecret: kubevirt-redfish-secret

  # ── Only used when existingSecret is "" ────────────────────────────────────
  # Kept here as the documented shape of config.yaml even when the Secret is
  # out-of-band: copy this block into the file you feed `oc create secret`.
  secretName: kubevirt-redfish-secret
  # `enhanced` → Redfish system IDs are <namespace>.<vm-name>. `legacy` → <vm-name>.
  # BMC addresses embed this, so changing it later invalidates every consumer.
  systemIdConvention: enhanced
  chassis:
    - name: vms
      # The namespace your VMs live in.
      namespace: ""
      # Defaults to the chart's own ServiceAccount (the release name) when omitted.
      vmSelector:
        labels:
          # ONLY VMs carrying this label are visible over Redfish.
          redfish-enabled: "true"
  users:
    - username: admin
      # bcrypt hash from `htpasswd -nbB "" '<password>' | cut -d: -f2`.
      # NEVER commit a real one — this path is dev-only.
      passwordHash: ""
      chassis:
        - vms
  datavolume:
    # Backs VirtualMedia (InsertMedia) — the ISO is imported into a DataVolume by
    # CDI. Must be a storage class that exists on this cluster.
    storageClass: ""
    storageSize: 3Gi
