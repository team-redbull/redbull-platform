{{- if (not .Values.config.existingSecret) }}
# DEV ONLY. Rendered only when redfish.config.existingSecret is "". The plaintext
# password below grants full management control over every exposed VM, independently of any
# OpenShift RBAC — on a real cluster leave existingSecret set and create this Secret
# out of band (see the header of values.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.config.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "redfish.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
type: Opaque
stringData:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: {{ .Values.port }}
      tls:
        enabled: false
    system_id_convention: {{ .Values.config.systemIdConvention | quote }}
    chassis:
      {{- range .Values.config.chassis }}
      - name: {{ .name | quote }}
        namespace: {{ required "redfish.config.chassis[].namespace must be set — it is the namespace your VMs live in" .namespace | quote }}
        service_account: {{ .serviceAccount | default (include "redfish.fullname" $) | quote }}
        vm_selector:
          labels:
            {{- toYaml .vmSelector.labels | nindent 12 }}
      {{- end }}
    authentication:
      users:
        {{- range .Values.config.users }}
        - username: {{ .username | quote }}
        {{- /*
          PLAINTEXT, not a hash. The 4.22 docs show a nested `password: {hash: …}`, but
          the v4.22 image declares `password` as a plain Go string (upstream
          kubevirt-1.8-tp, no bcrypt in the binary at all) and dies at startup on the
          hash form with `authentication.users[0].password expected type string got
          unconvertible type map[string]interface {} value map[hash:…]`. See values.yaml
          before "fixing" this back to what the docs say.
        */}}
          {{- $pw := required "redfish.config.users[].password must be set — plaintext, min 6 chars; the v4.22 image parses no other shape" .password }}
          {{- if lt (len $pw) 6 }}
          {{- fail (printf "redfish.config.users[%s]: password must be at least 6 characters — the v4.22 binary rejects shorter ones at startup" .username) }}
          {{- end }}
          password: {{ $pw | quote }}
          chassis:
            {{- range .chassis }}
            - {{ . | quote }}
            {{- end }}
        {{- end }}
    datavolume:
      storage_class: {{ required "redfish.config.datavolume.storageClass must be set — it backs VirtualMedia ISO imports" .Values.config.datavolume.storageClass | quote }}
      storage_size: {{ .Values.config.datavolume.storageSize | quote }}
      allow_insecure_tls: {{ .Values.config.datavolume.allowInsecureTls | default false }}
      helper_image: {{ .Values.config.datavolume.helperImage | quote }}
      iso_download_timeout: {{ .Values.config.datavolume.isoDownloadTimeout | quote }}
{{- end }}
