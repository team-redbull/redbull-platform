apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redfish.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "redfish.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "redfish.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redfish.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "redfish.fullname" . }}
      securityContext:
        # No runAsUser on purpose: OpenShift's restricted-v2 SCC assigns a UID from
        # the namespace's own range. Pinning one here would be rejected outright.
        runAsNonRoot: true
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: "/app/config/config.yaml"
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /redfish/v1/
              port: {{ .Values.port }}
              # Plain HTTP despite the 8443 port number — TLS is terminated at the
              # Route (config.server.tls.enabled is false).
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /redfish/v1/
              port: {{ .Values.port }}
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config-volume
          secret:
            secretName: {{ .Values.config.existingSecret | default .Values.config.secretName }}
