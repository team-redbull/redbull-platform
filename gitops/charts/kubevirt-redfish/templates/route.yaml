{{- if .Values.route }}
{{- /* Presence IS the switch: the `route:` block existing enables the Route. To turn it
       off, set `route: null` in a higher values layer — Helm's coalesce DELETES a key
       set to null, so the block from this file disappears and this guard is false.
       An empty `route: {}` would still be truthy; null is the off switch. */}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "redfish.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "redfish.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- with .Values.route.host }}
  host: {{ . | quote }}
  {{- end }}
  port:
    targetPort: http
  to:
    kind: Service
    name: {{ include "redfish.fullname" . }}
    weight: 100
  tls:
    termination: {{ .Values.route.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.insecureEdgeTerminationPolicy }}
{{- end }}
