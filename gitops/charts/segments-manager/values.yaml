image:
  repository: ghcr.io/team-redbull/segments-manager
  tag: v0.1.7
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
route:
  enabled: true
  wildcardPolicy: None
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
siteNetworks:
  site1:
    pool: "192.10.0.0/16"
    dell-bmc: "10.50.0.0/16"
    cisco-bmc: "10.60.0.0/16"
  site2:
    pool: "193.51.0.0/16"
    dell-bmc: "10.51.0.0/16"
    cisco-bmc: "10.61.0.0/16"
  site3:
    pool: "194.52.0.0/16"
    dell-bmc: "10.52.0.0/16"
    cisco-bmc: "10.62.0.0/16"
config:
  serverPort: "8000"
mongodb:
  url: "mongodb://segments_manager:segments-manager-mongo-pw@segments-mongodb.segments-manager.svc.cluster.local:27017/segments_manager?authSource=segments_manager"
  dbName: "segments_manager"
  collection: "segments"
auth:
  existingSecret: "segments-manager-api-token"
  existingSecretKey: "api-token"
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
livenessProbe:
  httpGet:
    path: /api/health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /api/health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /api/health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 12
