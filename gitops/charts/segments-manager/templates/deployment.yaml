apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "segments-manager.fullname" . }}
  labels:
    {{- include "segments-manager.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "segments-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "segments-manager.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: default
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: SITE_NETWORKS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "segments-manager.fullname" . }}
                  key: SITE_NETWORKS
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "segments-manager.fullname" . }}
                  key: SERVER_PORT
            - name: MONGODB_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "segments-manager.fullname" . }}
                  key: MONGODB_DB_NAME
            - name: MONGODB_COLLECTION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "segments-manager.fullname" . }}
                  key: MONGODB_COLLECTION
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.mongodb.existingSecret }}{{ .Values.mongodb.existingSecret }}{{ else }}{{ include "segments-manager.fullname" . }}-mongodb{{ end }}
                  key: {{ if .Values.mongodb.existingSecret }}{{ .Values.mongodb.existingSecretKey | default "mongodb-url" }}{{ else }}mongodb-url{{ end }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.existingSecret is required: create the API-token Secret out-of-band and name it here" .Values.auth.existingSecret }}
                  key: {{ .Values.auth.existingSecretKey | default "api-token" }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
