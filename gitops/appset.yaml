# THE one generic ApplicationSet. Sweeps gitops/services/<env>/<service>/app.yaml and
# generates one Argo CD Application per (env, service). Adding a service = a new folder;
# adding an env = a new services/<env>/ folder + values/<env>.yaml. No new ApplicationSet.
#
# Lives in the OpenShift GitOps instance namespace (user1-argocd).
#
# Git host is the ONLY thing that changes moving to the air-gapped GitLab — the three
# repoURLs marked below and the project sourceRepos. GitHub is flat (helm-charts-<name>);
# GitLab uses a real subgroup (helm-charts/<name>). See README "Air-gapped GitLab".
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: redbull-services
  namespace: user1-argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        # ← host: GitLab in the air-gapped env
        repoURL: https://github.com/team-redbull/redbull-platform.git
        revision: main
        files:
          - path: gitops/services/*/*/app.yaml
  template:
    metadata:
      # env = 3rd path segment (gitops/services/<env>/<service>), service = folder name.
      # prod is canonical → unprefixed (temporal); every other env gets an <env>- prefix
      # (dev-temporal). One conditional, easy to extend.
      name: '{{ if eq (index .path.segments 2) "prod" }}{{ .path.basename }}{{ else }}{{ index .path.segments 2 }}-{{ .path.basename }}{{ end }}'
    spec:
      project: redbull-platform
      sources:
        # 1) the service's chart — its own repo in the helm-charts group, chart at root.
        #    ← host+layout: GitLab subgroup 'helm-charts/{{ .path.basename }}' in air-gapped
        #    Optional escape hatch: this service's app.yaml may set `repoUrl` to point
        #    the chart source at any repo directly (any host/layout — a mono-repo, a
        #    per-team mirror, a repo outside the helm-charts group entirely), bypassing
        #    the helm-charts-<service>/helm-charts/<service> naming convention below.
        #    Absent (the common case) falls back to that convention unchanged.
        - repoURL: '{{ dig "repoUrl" (printf "https://github.com/team-redbull/helm-charts-%s.git" .path.basename) . }}'
          targetRevision: '{{ .revision }}'
          path: .
          helm:
            # Release name = the SERVICE (env-independent), not the Argo app name.
            # So resources are named the same in every env (temporal-*, segments-manager,
            # …) — env separation is by NAMESPACE, not by resource name. This is why no
            # chart needs a per-env fullnameOverride (the charts' fullname helpers collapse
            # to the release name / hardcode their names).
            releaseName: '{{ .path.basename }}'
            # shared env globals first, then this service's own values (override). This
            # is the common-case default; when a service's app.yaml sets `extraValueFiles`
            # (or `overrides`), templatePatch below REPLACES this whole `sources` list
            # wholesale with the fully-resolved version (extras prepended) — see there for
            # why (Sources is a real typed []string field: a variable-length list can't be
            # built with a bare {{ range }}/{{ if }} here, that's not valid YAML/JSON at
            # rest, only inside a string field like templatePatch).
            valueFiles:
              - '$values/gitops/values/{{ index .path.segments 2 }}.yaml'
              - '$values/{{ .path.path }}/values.yaml'
        # 2) this repo, only as the $values source for the valueFiles above.
        #    ← host: GitLab in the air-gapped env
        - repoURL: https://github.com/team-redbull/redbull-platform.git
          targetRevision: main
          ref: values
      destination:
        # optional per-service override (other cluster, e.g. a future Vault limb);
        # defaults to the cluster this ApplicationSet runs on.
        name: '{{ dig "destination" "cluster" "in-cluster" . }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        # CreateNamespace is commented out, not enabled: this is a *namespaced* OpenShift
        # GitOps instance, whose application-controller has no RBAC on cluster-scoped
        # Namespace objects today (verified live — it gets `forbidden` trying to create OR
        # patch one). Uncommenting the line below will make every sync fail until that SA
        # is granted a ClusterRole for namespaces create/patch — which also weakens this
        # instance's namespace isolation, so do that deliberately, not as a side effect of
        # copy-pasting this line. Until then, the `namespaces` Helmfile release pre-creates
        # every target namespace AND stamps the argocd.argoproj.io/managed-by label that
        # grants this instance its in-namespace RBAC — so Argo never needs to touch the
        # Namespace itself. (The namespaces release runs in every environment, including
        # air-gapped ones where the DBs are external — it doesn't depend on the DBs.)
        # syncOptions:
        #   - CreateNamespace=true
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
  # templatePatch is a plain STRING field — unlike `template.spec` above (a typed
  # object, so any {{ }} there has to sit entirely inside one already-declared
  # scalar/field), this whole block is Go-templated as TEXT first and only re-parsed
  # as YAML afterwards, then JSON-merge-patched onto the generated Application. That's
  # the one place variable-length lists (e.g. extraValueFiles) can actually be built.
  #
  # Always (re)builds `spec.sources` — identical to the static block above when this
  # service's app.yaml sets neither `extraValueFiles` nor `repoUrl`, but with any
  # `extraValueFiles` entries prepended to source #1's valueFiles otherwise (see the
  # "Layering extra chart-local value files" section in README.md). Since JSON merge
  # patch replaces whole arrays rather than merging them element-wise, both sources
  # (the chart AND the $values repo) are always spelled out here in full.
  #
  # Then deep-merges in this service's `overrides:` key on top, if set — the original,
  # still-supported escape hatch for anything else (e.g. `destination`), unrelated to
  # sources.
  templatePatch: |
    {{- $valueFiles := concat (dig "extraValueFiles" (list) .) (list (printf "$values/gitops/values/%s.yaml" (index .path.segments 2)) (printf "$values/%s/values.yaml" .path.path)) }}
    {{- $source1 := dict
          "repoURL" (dig "repoUrl" (printf "https://github.com/team-redbull/helm-charts-%s.git" .path.basename) .)
          "targetRevision" .revision
          "path" "."
          "helm" (dict "releaseName" .path.basename "valueFiles" $valueFiles)
    }}
    {{- $source2 := dict "repoURL" "https://github.com/team-redbull/redbull-platform.git" "targetRevision" "main" "ref" "values" }}
    {{- $patch := dict "spec" (dict "sources" (list $source1 $source2)) }}
    {{- if hasKey . "overrides" }}
    {{- $patch = mergeOverwrite $patch .overrides }}
    {{- end }}
    {{ toYaml $patch }}
