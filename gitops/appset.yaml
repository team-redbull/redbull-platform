# THE one generic ApplicationSet. Sweeps gitops/services/<service>/app.yaml and generates
# one Argo CD Application per service. Adding a service = one chart folder under
# gitops/charts/ + one app.yaml here. No new ApplicationSet, ever.
#
# Lives in the OpenShift GitOps instance namespace (openshift-gitops) — the operator's
# DEFAULT, cluster-scoped instance.
#
# SINGLE SOURCE, SINGLE REPO. Every service's chart lives in THIS repo at
# gitops/charts/<service>/, and that chart's own values.yaml is the whole configuration —
# no per-environment values layer, no $values second source, no valueFiles by default.
# The folder name is the only identifier: it is the Argo app name, the chart path AND the
# Helm release name, so resources are named after the service in every cluster.
#
# There is exactly ONE environment here. The air-gapped side runs its own Argo
# architecture (and its own copy of this repo); it does not share this file's shape, so
# do not reintroduce an <env> path segment to serve it. See README.
#
# Git host is the only thing that changes when this repo is mirrored to the air-gapped
# GitLab: the two repoURLs below and the project's sourceRepos.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: redbull-services
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        # ← host: GitLab in the air-gapped env
        repoURL: https://github.com/team-redbull/redbull-platform.git
        revision: main
        files:
          - path: gitops/services/*/app.yaml
  template:
    metadata:
      # service = the folder name. One environment, so no prefix and no conditional.
      name: '{{ .path.basename }}'
      # Cascade-delete guard — deleting a service must delete its workloads.
      # Without this finalizer, deleting an Application is a NON-CASCADING delete: the
      # Application object vanishes and every resource it managed is ORPHANED in the
      # cluster. That is exactly the path taken when a service's folder is removed from
      # gitops/services/ — the generator stops emitting it, the ApplicationSet deletes
      # the Application, and the workloads silently stay behind forever.
      # Argo CD 3.x adds this finalizer to generated Applications on its own, so on a
      # current cluster it looks unnecessary; older controllers do NOT. Declaring it
      # explicitly makes deletion version-independent. This is defence in depth — it is
      # NOT the diagnosed cause of the 2026-07-28 air-gapped orphaning incident, whose
      # apps already carried the finalizer (see CLAUDE.md).
      # Do NOT remove it, and do not set spec.syncPolicy.preserveResourcesOnDeletion:
      # true (which suppresses the same cascade), without re-deriving the above.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: redbull-platform
      # ONE source: this repo, at this service's chart folder. The chart and the
      # ApplicationSet that deploys it now move in the same commit and are rendered from
      # the same revision, which is what removes the whole class of multi-source
      # rendering failures the previous $values layout had.
      source:
        # ← host: GitLab in the air-gapped env
        repoURL: https://github.com/team-redbull/redbull-platform.git
        targetRevision: main
        path: 'gitops/charts/{{ .path.basename }}'
        helm:
          # Release name = the SERVICE, so resources are named the same everywhere
          # (temporal-*, segments-manager, …) and cross-service FQDNs stay stable.
          releaseName: '{{ .path.basename }}'
          # No valueFiles: the chart's own values.yaml IS the configuration. A service
          # that genuinely needs an override declares `valueFiles:` in its app.yaml —
          # see templatePatch below.
      destination:
        # optional per-service override (other cluster, e.g. a future Vault limb);
        # defaults to the cluster this ApplicationSet runs on.
        name: '{{ dig "destination" "cluster" "in-cluster" . }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        # CreateNamespace stays OFF, deliberately, even though this instance COULD do it:
        # the `openshift-gitops` default instance is cluster-scoped (its
        # application-controller holds a ClusterRoleBinding), so unlike the namespaced
        # `user1-argo` instance this repo used to target, it is not forbidden from creating
        # a Namespace. The `namespaces` Helmfile release remains the single owner of every
        # target namespace instead, for two reasons that outlive the instance choice: it
        # runs in the bootstrap of EVERY environment (including air-gapped ones where the
        # DBs are external, so it does not depend on them), and keeping one owner means a
        # namespace is never a race between two tools. It also stamps the
        # argocd.argoproj.io/managed-by label, which a NAMESPACED instance needs for
        # in-namespace RBAC — harmless here, and what makes this repo portable to an env
        # that runs one.
        #
        # If you do enable it, note a namespaced instance needs a ClusterRole for
        # namespaces create/patch first, or every sync fails with `forbidden`.
        # syncOptions:
        #   - CreateNamespace=true
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }

  # templatePatch is a plain STRING field — unlike `template.spec` above (a typed object,
  # where any {{ }} has to sit inside an already-declared scalar), this whole block is
  # Go-templated as TEXT first and only re-parsed as YAML afterwards, then JSON-merge
  # -patched onto the generated Application. That is the one place a variable-length list
  # (valueFiles) can actually be built.
  #
  # It emits `{}` for the common case — every service today — and JSON merge patch merges
  # nested objects, so it only ever needs to name the keys it actually changes.
  #
  # 1) `valueFiles:` in app.yaml — the override hook. Paths are written repo-root
  #    relative (e.g. gitops/overrides/segments-manager.yaml) and prefixed here with
  #    ../../../ because Helm resolves valueFiles relative to the chart dir, which is
  #    always exactly 3 levels down (gitops/charts/<service>). Argo permits a value file
  #    outside the app path as long as it resolves inside the repo. Override files live
  #    under gitops/overrides/ and NOT inside gitops/services/<service>/ on purpose: a
  #    referenced file inside the watched folder is what made deleting a service deadlock
  #    its own deletion (CLAUDE.md).
  # 2) `overrides:` in app.yaml — the general escape hatch, deep-merged last. It can set
  #    anything on the Application, including replacing `source` outright for the rare
  #    service whose chart cannot live in this repo.
  templatePatch: |
    {{- $patch := dict }}
    {{- if hasKey . "valueFiles" }}
    {{- $files := list }}
    {{- range .valueFiles }}
    {{- $files = append $files (printf "../../../%s" .) }}
    {{- end }}
    {{- $patch = dict "spec" (dict "source" (dict "helm" (dict "valueFiles" $files))) }}
    {{- end }}
    {{- if hasKey . "overrides" }}
    {{- $patch = mergeOverwrite $patch .overrides }}
    {{- end }}
    {{ toYaml $patch }}
